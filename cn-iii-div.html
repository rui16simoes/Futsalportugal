<style>
  :root{--bg:#0b0f1a;--bg2:#111827;--card:#161e2e;--card2:#1f2937;--line:#2b3648;--text:#eef2f7;--muted:#93a1b1;--accent:#8b5cf6;--green:#10b981;--red:#ef4444}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  .hero{background:linear-gradient(135deg,#0b1220 0%,#1e293b 100%);padding:36px 28px;border-radius:16px;margin-bottom:20px;position:relative;overflow:hidden;text-align:center}
  .hero::before{content:"";position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,.15),transparent 70%);pointer-events:none}
  .hero .eyebrow{font-size:12px;color:#93a1b1;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:10px}
  .hero h1{font-size:36px;font-weight:900;margin:0;letter-spacing:-1px;line-height:1.05}
  .hero h1 .lig{color:#8b5cf6}
  .hero .lede{font-size:15px;color:#cbd5e1;margin:12px auto 0;max-width:760px;line-height:1.55}
  .hero .stats{display:flex;gap:24px;margin-top:22px;flex-wrap:wrap;justify-content:center}
  .hero .stat b{display:block;font-size:26px;font-weight:800;color:#f3f4f6}
  .hero .stat span{font-size:11px;color:#93a1b1;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;display:block}
  .serie-tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--line);position:sticky;top:0;z-index:60;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .serie-tab{flex:1;padding:12px 16px;background:transparent;border:0;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;border-radius:8px;font-family:inherit;transition:all .15s;letter-spacing:.05em}
  .serie-tab:hover{color:var(--text)}
  .serie-tab.active{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.35)}
  .toolbar{background:var(--card);padding:14px 18px;border-radius:12px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid var(--line)}
  .toolbar label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .toolbar select{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;font-family:inherit;min-width:150px}
  .btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .jornada{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
  .jornada-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .jornada-title{font-size:20px;font-weight:800}
  .jornada-title .n{color:var(--accent)}
  .jornada-date{font-size:13px;color:var(--muted);font-weight:600}
  .jogos{display:grid;gap:8px}
  .jogo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--bg2);padding:12px 16px;border-radius:10px;border:1px solid transparent}
  .team-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:4px}
  .mc-inline{width:100%;font-size:11px;color:#cbd5e1;line-height:1.4}
  .team-side.casa .mc-inline{text-align:right}
  .team-side.fora .mc-inline{text-align:left}
  .team-side.casa{justify-content:flex-end;text-align:right}
  .team-side.fora{justify-content:flex-start}
  .team-name{font-weight:600;font-size:14px}
  .team-logo{width:40px;height:40px;object-fit:contain;background:transparent;padding:0;border-radius:6px}.team-badge{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex:none;letter-spacing:.05em}
  .score{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;min-width:100px;justify-content:center}
  .score .sep{color:var(--muted)}
  .score .vs{color:var(--muted);font-size:14px;font-weight:600}
  .score.played{color:var(--accent)}
  .score .v{font-size:1.4em;font-weight:700;min-width:24px;text-align:center;display:inline-block;padding:2px 6px;line-height:1;color:#fff}
  .jogo-meta{grid-column:1/4;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
  .footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-style:italic}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  @media(max-width:900px){.wrap{padding:14px}.hero{padding:22px 18px}.hero h1{font-size:26px}.toolbar{padding:10px;gap:8px}.jornada{padding:14px}.jornada-title{font-size:17px}}
  @media(max-width:640px){html,body{max-width:100vw;overflow-x:hidden}.wrap{padding:10px 12px 24px;max-width:100%}.hero{padding:22px 14px;border-radius:14px;margin-bottom:12px}.hero h1{font-size:clamp(20px,6.5vw,26px)}.hero .stats{gap:8px;margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr)}.hero .stat b{font-size:clamp(16px,5vw,20px)}.hero .stat span{font-size:9px}.serie-tab{font-size:13px;padding:10px 8px}.toolbar{padding:8px;gap:6px}.toolbar select{padding:10px 8px;font-size:14px;flex:1;min-width:0}.jornada{padding:14px 10px;margin-bottom:12px}.jornada-head{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:4px}.jornada-title{font-size:16px}.jornada-date{font-size:11.5px}.jogos{gap:6px}.jogo{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:6px;padding:10px 8px;min-height:58px}.team-side{gap:6px;min-width:0;overflow:hidden}.team-name{font-size:12.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;flex:1;min-width:0}.team-badge{width:32px;height:32px;flex:none;font-size:10.5px}.score{font-size:16px;min-width:72px;width:72px;gap:4px;padding:0}.score .sep{font-size:14px}.score .vs{font-size:11px}.jogo-meta{grid-column:1/4;font-size:10.5px;gap:8px;padding-top:6px;margin-top:4px;justify-content:center;flex-wrap:wrap}}
  /* Standings */
  .classif-box{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin:0 0 18px;overflow-x:auto}
  .classif-box h3{margin:0 0 10px;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#e5e7eb;display:flex;align-items:center;gap:8px}
  .classif-box h3::before{content:"";width:4px;height:16px;background:var(--accent,#8b5cf6);border-radius:2px}
  table.classif{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
  table.classif th{text-align:center;padding:6px 4px;color:#9ca3af;font-weight:500;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px}
  table.classif td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
  table.classif td.name{text-align:left;font-weight:500;color:#f3f4f6;white-space:nowrap}
  table.classif td.pos{color:#9ca3af;font-weight:600;width:24px}
  table.classif td.pts{font-weight:700;color:#fff}
  table.classif tr.p1 td.pos,table.classif tr.p2 td.pos{color:#22c55e}
  table.classif tr.bottom td.pos{color:#ef4444}
  :root[data-theme="dia"]{--bg:#f0f4f8;--bg2:#e2e8f0;--card:#ffffff;--card2:#f8fafc;--line:#cbd5e1;--text:#1e293b;--muted:#64748b;--accent:#7c3aed;--green:#059669;--red:#dc2626}
  :root[data-theme="dia"] .hero{background:linear-gradient(135deg,#e0e7ff 0%,#dbeafe 100%)!important}
  :root[data-theme="dia"] .hero .eyebrow,:root[data-theme="dia"] .hero .lede,:root[data-theme="dia"] .hero .stat span{color:#475569}
  :root[data-theme="dia"] .hero .stat b{color:#1e293b}
  .theme-toggle{position:fixed;bottom:18px;right:18px;z-index:999;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:all .2s}
  .theme-toggle:hover{transform:scale(1.1)}
.hero-logo-wrap{text-align:center;margin-bottom:14px}.hero-logo{max-height:200px;width:auto;max-width:90%;height:auto;border-radius:8px}@media(max-width:640px){.hero-logo{max-height:150px}}
</style>

let DATA=JSON.parse(JSON.stringify(INITIAL_DATA));
let SERIE="A";
const filterJ=document.getElementById("filterJ");
const filterT=document.getElementById("filterT");

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function badge(id){
  const t=TEAMS[id]||{name:id,short:id,color:"#374151"};
  if(t.logo) return `<img class="team-logo" src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<div class=&quot;team-badge&quot; style=&quot;background:${t.color}&quot;>${esc(t.short)}</div>'">`;
  return `<div class="team-badge" style="background:${t.color}">${t.short}</div>`;
}
function fmtDate(d){
  if(!d)return "";
  const[y,m,dd]=d.split("-");
  const days=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const dt=new Date(+y,+m-1,+dd);
  return `${days[dt.getDay()]}, ${+dd} ${months[+m-1]} ${y}`;
}
function jornadaHtml(j,dj){
  const jorLabel = String(j).replace(/[a-z]/gi,'');
  const suffix = String(j).match(/[a-z]+$/i)?.[0]||'';
  const jorTitle = suffix ? `J${jorLabel} <span style="font-size:12px;color:var(--muted)">· cont.</span>` : `J${jorLabel}`;
  let h=`<div class="jornada"><div class="jornada-head"><div class="jornada-title">Jornada <span class="n">${jorTitle}</span></div><div class="jornada-date">${fmtDate(dj.data)}</div></div><div class="jogos">`;
  for(const g of dj.jogos){
    const played=g.golosCasa!=null&&g.golosFora!=null;
    const sc=played?`<span class="v">${g.golosCasa}</span><span class="sep">–</span><span class="v">${g.golosFora}</span>`:`<span class="vs">vs</span>`;
    const mc=g.marcadoresCasa||"";
    const mf=g.marcadoresFora||"";
    const mcHtml=mc?`<div class="mc-inline">${mc}</div>`:"";
    const mfHtml=mf?`<div class="mc-inline">${mf}</div>`:"";
    h+=`<div class="jogo">
      <div class="team-side casa">${badge(g.casa)}<div><span class="team-name">${tname(g.casa)}</span>${mcHtml}</div></div>
      <div class="score${played?" played":""}">${sc}</div>
      <div class="team-side fora"><div><span class="team-name">${tname(g.fora)}</span>${mfHtml}</div>${badge(g.fora)}</div>
      ${g.pavilhao?`<div class="jogo-meta"><span>🏟 ${g.pavilhao}</span><span>⏰ ${g.hora}</span></div>`:""}
    </div>`;
  }
  h+="</div></div>";
  return h;
}
function calcStandings(sk){
  const sd=DATA.series[sk];const tb={};
  for(const jj of Object.values(sd.jornadas)){
    for(const g of jj.jogos){
      const c=String(g.casa),f=String(g.fora);
      if(!tb[c])tb[c]={p:0,v:0,e:0,d:0,gf:0,gc:0,pts:0};
      if(!tb[f])tb[f]={p:0,v:0,e:0,d:0,gf:0,gc:0,pts:0};
      if(g.golosCasa==null||g.golosFora==null)continue;
      const gc=+g.golosCasa,ga=+g.golosFora;
      tb[c].p++;tb[f].p++;tb[c].gf+=gc;tb[c].gc+=ga;tb[f].gf+=ga;tb[f].gc+=gc;
      if(gc>ga){tb[c].v++;tb[c].pts+=3;tb[f].d++;}
      else if(gc<ga){tb[f].v++;tb[f].pts+=3;tb[c].d++;}
      else{tb[c].e++;tb[c].pts++;tb[f].e++;tb[f].pts++;}
    }
  }
  return Object.entries(tb).map(([id,st])=>(({id,name:(TEAMS[id]&&TEAMS[id].name)||id,...st,dg:st.gf-st.gc}))).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.name.localeCompare(b.name)).map((r,i)=>(({pos:i+1,...r})));
}
function renderStandingsHtml(sk){
  const rows=calcStandings(sk);if(!rows.length)return"";
  const n=rows.length;
  let h=`<div class="classif-box"><h3>📊 Classificação</h3><table class="classif"><thead><tr><th></th><th style="text-align:left">Equipa</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const cls="p"+r.pos+(i===n-1?" bottom":"");
    h+=`<tr class="${cls}"><td class="pos">${r.pos}</td><td class="name">${r.name}</td><td class="pts">${r.pts}</td><td>${r.p}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.dg>=0?"+":""}${r.dg}</td></tr>`;
  });
  h+="</tbody></table></div>";return h;
}
function populateFilters(){
  const s=DATA.series[SERIE];
  const jNums=[...new Set(Object.keys(s.jornadas).map(x=>x.replace(/[a-z]/gi,'')))].map(Number).sort((a,b)=>a-b);
  filterJ.innerHTML=`<option value="">Todas</option>`+jNums.map(n=>`<option value="${n}">Jornada ${n}</option>`).join("");
  const teams=[...new Set(Object.values(s.jornadas).flatMap(jj=>jj.jogos.flatMap(g=>[String(g.casa),String(g.fora)])))].sort((a,b)=>tname(a).localeCompare(tname(b)));
  filterT.innerHTML=`<option value="">Todas</option>`+teams.map(id=>`<option value="${id}">${tname(id)}</option>`).join("");
}
function render(){
  const s=DATA.series[SERIE];
  const fj=filterJ.value,ft=filterT.value;
  let html="",played=0;
  const jorKeys=Object.keys(s.jornadas).sort((a,b)=>{
    const na=parseFloat(a),nb=parseFloat(b);
    if(na!==nb)return na-nb;
    return a.localeCompare(b);
  });
  for(const jk of jorKeys){
    const dj=s.jornadas[jk];if(!dj)continue;
    played+=dj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length;
    const jorNum=jk.replace(/[a-z]/gi,'');
    if(fj&&jorNum!==fj)continue;
    if(ft){
      const jf=dj.jogos.filter(g=>String(g.casa)===ft||String(g.fora)===ft);
      if(!jf.length)continue;
      html+=jornadaHtml(jk,{...dj,jogos:jf});
    }else html+=jornadaHtml(jk,dj);
  }
  grid.innerHTML=(filterJ.value===''&&filterT.value===''?renderStandingsHtml(SERIE):"")+(html||`<div style="text-align:center;padding:40px;color:var(--muted)">Sem jogos que correspondam ao filtro.</div>`);
  let allPlayed=0;
  Object.values(DATA.series).forEach(ss=>Object.values(ss.jornadas).forEach(jj=>allPlayed+=jj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length));
  document.getElementById("stat-played").textContent=allPlayed;
}
document.querySelectorAll(".serie-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".serie-tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");SERIE=btn.dataset.serie;populateFilters();render();
  });
});
filterJ.addEventListener("change",render);
filterT.addEventListener("change",render);

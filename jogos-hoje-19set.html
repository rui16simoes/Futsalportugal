<title>Futsal Â· Resultados</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3350; --text: #e8eaf0; --muted: #7b82a3;
    --done: #22c55e; --live: #ef4444; --sched: #475569;
    --hero-bg: linear-gradient(135deg,#0d1b3e 0%,#1a0a2e 100%);
    --hero-title: linear-gradient(135deg,#fff 30%,#a5b4fc 100%);
    --theme-btn-bg: rgba(255,255,255,.07);
  }
  body.light {
    --bg: #f0f2f8; --surface: #ffffff; --surface2: #e8ebf4;
    --border: #d1d5e8; --text: #1a1d27; --muted: #5a6280;
    --done: #16a34a; --live: #dc2626; --sched: #94a3b8;
    --hero-bg: linear-gradient(135deg,#1e3a8a 0%,#4c1d95 100%);
    --hero-title: linear-gradient(135deg,#fff 30%,#c7d2fe 100%);
    --theme-btn-bg: rgba(255,255,255,.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; transition: background .2s, color .2s; }

  /* HERO */
  .hero { background: var(--hero-bg); padding: 20px 16px 16px; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
  .hero-label { font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 6px; }
  .hero-title { font-size: clamp(18px,3.5vw,26px); font-weight: 900; letter-spacing: -.02em; background: var(--hero-title); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .theme-btn { position: absolute; top: 14px; right: 14px; background: var(--theme-btn-bg); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 5px 10px; cursor: pointer; font-size: 14px; color: #fff; transition: background .2s; }
  .theme-btn:hover { background: rgba(255,255,255,.15); }

  /* DATE NAV */
  .nav-wrapper { position: relative; display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--border); }
  .nav-arrow { flex-shrink: 0; background: var(--surface); border: none; border-bottom: none; color: var(--muted); font-size: 22px; font-weight: 300; padding: 0 14px; cursor: pointer; transition: color .15s, background .15s; z-index: 2; line-height: 1; }
  .nav-arrow:hover { color: var(--text); background: var(--surface2); }
  .date-nav { flex: 1; background: var(--surface); padding: 0 4px; display: flex; overflow-x: auto; scrollbar-width: none; }
  .date-nav::-webkit-scrollbar { display: none; }
  .date-btn { background: none; border: none; color: var(--muted); padding: 10px 11px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all .15s; position: relative; top: 1px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .date-btn:hover { color: var(--text); }
  .date-btn.active { color: #a5b4fc; border-bottom-color: #a5b4fc; }
  .date-btn .dday { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; }
  .date-btn .dnum { font-size: 15px; font-weight: 900; line-height: 1.1; }
  .date-btn .dmon { font-size: 8px; letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
  .date-btn .dcount { font-size: 9px; color: var(--sched); }
  .date-btn.active .dcount { color: #a5b4fc; }

  /* PAGE */
  .page { max-width: 860px; margin: 0 auto; padding: 18px 14px 60px; }

  /* SECTION */
  .section { margin-bottom: 18px; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .section-title { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; text-decoration: none; transition: opacity .15s; }
  .section-title:hover { opacity: .7; }
  .section-flag { font-size: 14px; }
  .section-round { font-size: 10px; color: var(--muted); margin-left: auto; font-weight: 600; }
  .section-ext { font-size: 10px; color: #3d4468; margin-left: 4px; }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

  /* SERIE */
  .serie-lbl { background: var(--surface2); padding: 4px 14px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  .serie-lbl:not(:first-child) { border-top: 1px solid var(--border); }

  /* GAME ROW */
  .game { display: grid; grid-template-columns: 44px 1fr auto 1fr auto; align-items: center; gap: 5px; padding: 8px 12px 6px; border-bottom: 1px solid var(--border); transition: background .1s; }
  .game:last-child { border-bottom: none; }
  .game:hover { background: var(--surface2); }
  .g-time { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .g-home { font-size: 12px; font-weight: 600; color: var(--text); text-align: right; line-height: 1.3; }
  .g-away { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .g-score { display: flex; align-items: center; gap: 3px; justify-content: center; min-width: 60px; }
  .s-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; font-size: 14px; font-weight: 900; min-width: 24px; text-align: center; line-height: 1.3; }
  .s-box.done { border-color: #166534; color: var(--done); }
  .s-box.live { border-color: #991b1b; color: var(--live); animation: spulse 2s ease-in-out infinite; }
  .s-sep { font-size: 10px; font-weight: 700; color: var(--border); }
  .s-dash { font-size: 15px; color: var(--border); font-weight: 200; }
  .g-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sched); flex-shrink: 0; }
  .g-dot.done { background: var(--done); }
  .g-dot.live { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
  .g-venue { grid-column: 1/-1; font-size: 9.5px; color: var(--muted); opacity: .5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-scorers { grid-column: 1/-1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-top: 2px; padding-bottom: 2px; }
  .g-scorers-home { font-size: 9.5px; color: #5a6080; text-align: right; flex: 1; line-height: 1.4; }
  .g-scorers-away { font-size: 9.5px; color: #5a6080; flex: 1; line-height: 1.4; }
  .g-scorers-mid { width: 60px; flex-shrink: 0; }

  /* EMPTY */
  .empty-day { text-align: center; padding: 50px 20px; }
  .empty-day .e-icon { font-size: 36px; margin-bottom: 10px; opacity: .4; }
  .empty-day .e-text { font-size: 14px; color: var(--muted); }

  footer { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); opacity: .5; border-top: 1px solid var(--border); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes spulse { 0%,100%{opacity:1} 50%{opacity:.5} }


  @media (max-width:520px) {
    .game { grid-template-columns: 36px 1fr auto 1fr auto; gap: 3px; padding: 7px 9px 5px; }
    .g-home,.g-away { font-size: 11px; }
    .s-box { font-size: 12px; min-width: 21px; padding: 2px 3px; }
  }
</style>
</head>

// â”€â”€ HELPERS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function countGames(day) {
  let n = 0;
  for (const s of day.sections) {
    if (s.games) n += s.games.length;
    if (s.series) for (const sr of s.series) n += sr.games.length;
  }
  return n;
}

function scoreHTML(g) {
  if (g.score) {
    return `<div class="s-box ${g.status}">${g.score[0]}</div><span class="s-sep">â€“</span><div class="s-box ${g.status}">${g.score[1]}</div>`;
  }
  return `<div class="s-box"><span class="s-dash">â€”</span></div><span class="s-sep" style="opacity:0">â€“</span><div class="s-box"><span class="s-dash">â€”</span></div>`;
}

function gameRow(g) {
  const venue = g.venue ? `<div class="g-venue">ðŸ“ ${g.venue}</div>` : '';
  const hs = g.hscorers && g.hscorers.length;
  const as_ = g.ascorers && g.ascorers.length;
  const scorers = (hs || as_) ? `
    <div class="g-scorers">
      <div class="g-scorers-home">${hs ? 'âš½ ' + g.hscorers.join(' Â· ') : ''}</div>
      <div class="g-scorers-mid"></div>
      <div class="g-scorers-away">${as_ ? 'âš½ ' + g.ascorers.join(' Â· ') : ''}</div>
    </div>` : '';
  return `<div class="game">
    <div class="g-time">${g.time}</div>
    <div class="g-home">${g.home}</div>
    <div class="g-score">${scoreHTML(g)}</div>
    <div class="g-away">${g.away}</div>
    <div class="g-dot ${g.status}"></div>
    ${venue}${scorers}
  </div>`;
}

// â”€â”€ RENDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderDay(dateKey) {
  const day = DAYS[dateKey];
  if (!day || !day.sections.length) {
    document.getElementById('content').innerHTML =
      `<div class="empty-day"><div class="e-icon">ðŸŸï¸</div><div class="e-text">Sem jogos para esta data</div></div>`;
    return;
  }
  let html = '';
  for (const sec of day.sections) {
    const titleEl = sec.link
      ? `<a class="section-title" href="${sec.link}" target="_blank" style="color:${sec.color}">${sec.comp} <span class="section-ext">â†—</span></a>`
      : `<span class="section-title" style="color:${sec.color}">${sec.comp}</span>`;
    html += `<div class="section">
      <div class="section-header">
        <span class="section-flag">${sec.flag}</span>
        <span class="section-dot" style="background:${sec.color}"></span>
        ${titleEl}
        <span class="section-round">${sec.round}</span>
      </div>
      <div class="card">`;
    if (sec.games) html += sec.games.map(gameRow).join('');
    if (sec.series) for (const sr of sec.series) {
      html += `<div class="serie-lbl">${sr.label}</div>` + sr.games.map(gameRow).join('');
    }
    html += `</div></div>`;
  }
  document.getElementById('content').innerHTML = html;
}

function buildNav(activeKey) {
  document.getElementById('date-nav').innerHTML = Object.entries(DAYS).map(([k, d]) => {
    const n = countGames(d);
    const cnt = n > 0
      ? `<span class="dcount">${n} jogos</span>`
      : `<span class="dcount" style="opacity:.3">â€”</span>`;
    return `<button class="date-btn ${k===activeKey?'active':''}" onclick="selectDate('${k}')">
      <span class="dday">${d.label[0]}</span>
      <span class="dnum">${d.label[1]}</span>
      <span class="dmon">${d.label[2]}</span>
      ${cnt}
    </button>`;
  }).join('');
}

function selectDate(key) {
  history.replaceState(null,'','#'+key);
  localStorage.setItem('fsDate', key);
  buildNav(key);
  renderDay(key);
  const lbl = DAYS[key].label[1] + ' ' + DAYS[key].label[2];
  document.getElementById('page-title').textContent = 'Futsal Â· ' + lbl;
  document.title = 'Futsal Â· ' + lbl;
  // scroll active button into view
  setTimeout(() => {
    const active = document.querySelector('.date-btn.active');
    if (active) active.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  }, 50);
}

// â”€â”€ SCROLL NAV â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function scrollNav(amount) {
  const nav = document.getElementById('date-nav');
  nav.scrollBy({ left: amount, behavior: 'smooth' });
}

// â”€â”€ INIT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
(function() {
  const hash = location.hash.replace('#','');
  const savedDate = localStorage.getItem('fsDate');
  const todayStr = new Date().toISOString().slice(0,10);
  const keys = Object.keys(DAYS);
  let selected;
  if (DAYS[hash]) {
    selected = hash;
  } else if (DAYS[savedDate]) {
    selected = savedDate;
  } else if (DAYS[todayStr]) {
    selected = todayStr;
  } else {
    let best = keys[0];
    for (const k of keys) { if (k <= todayStr) best = k; }
    selected = best;
  }
  selectDate(selected);
  const ts = document.getElementById('ts');
  if (ts) ts.textContent = new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
})();
</script>

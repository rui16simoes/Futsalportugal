function fmt(d){
  if(!d) return "";
  const dt=new Date(d+"T00:00:00");
  const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[dt.getDay()]}, ${dt.getDate()} ${meses[dt.getMonth()]}`;
}

function teamLogo(id){
  const t=TEAMS[id];
  if(!t) return `<span class="team-logo" style="font-size:14px;font-weight:700;color:#ec4899">?</span>`;
  if(t.logo){
    return `<img src="${t.logo}" alt="${t.name}" class="team-logo" style="width:36px;height:36px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.08);padding:2px" onerror="this.outerHTML='<span class=\\'team-logo\\' style=\\'font-size:14px;font-weight:700;color:#ec4899\\'>${t.name.charAt(0).toUpperCase()}</span>'">`;
  }
  const initial=t.name.charAt(0).toUpperCase();
  return `<span class="team-logo" style="font-size:14px;font-weight:700;color:#ec4899;background:rgba(236,72,153,.12);border-radius:6px;width:36px;height:36px;display:flex;align-items:center;justify-content:center">${initial}</span>`;
}

function renderJogo(j){
  const tc=TEAMS[j.casa]||{name:"?"};
  const tf=TEAMS[j.fora]||{name:"?"};
  const played=j.golosCasa!==null&&j.golosFora!==null;
  const metaParts=[];
  if(j.hora) metaParts.push(`🕐 ${j.hora}`);
  if(j.data) metaParts.push(`📅 ${fmt(j.data)}`);
  if(j.pavilhao) metaParts.push(`📍 ${j.pavilhao}`);
  const mcCasa=j.marcadoresCasa||"";
  const mcFora=j.marcadoresFora||"";
  const hasMc=mcCasa||mcFora;
  return `
  <div class="jogo">
    <div class="team-side casa">
      <span class="team-name">${tc.name}</span>
      ${teamLogo(j.casa)}
    </div>
    <div class="score${played?" played":""}">
      ${played?`<span class="v">${j.golosCasa}</span><span class="sep">–</span><span class="v">${j.golosFora}</span>`:`<span class="vs">vs</span>`}
    </div>
    <div class="team-side fora">
      ${teamLogo(j.fora)}
      <span class="team-name">${tf.name}</span>
    </div>
    ${metaParts.length?`<div class="jogo-meta">${metaParts.join('<span style="color:#3b4a5c">·</span>')}</div>`:''}
    ${hasMc?`<div class="marcadores-wrap">
      <div class="mc casa">${mcCasa}</div>
      <div class="mc sep">⚽</div>
      <div class="mc fora">${mcFora}</div>
    </div>`:''}
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  let html='';

  // Isentas
  html+=`<div class="isentos-block">
    <div class="isentos-title">⭐ Equipas Isentas da 1ª Eliminatória</div>
    <div class="isentos-subtitle">As seguintes equipas entram diretamente na 2ª Eliminatória:</div>
    <div class="isentos-grid">`;
  DATA.isentos.forEach(id=>{
    const t=TEAMS[id]||{name:"?"};
    html+=`<div class="isento-item"><span class="isento-badge">isenta</span>${t.name}</div>`;
  });
  html+=`</div></div>`;

  // Eliminatórias
  DATA.eliminatorias.forEach(elim=>{
    html+=`<div class="elim-block">
      <div class="elim-head">
        <div class="elim-title"><span class="n">${elim.nome}</span></div>
        ${elim.data?`<div class="elim-date">📅 ${fmt(elim.data)}</div>`:''}
      </div>`;
    elim.series.forEach(serie=>{
      html+=`<div class="serie-block">
        <div class="jogos">`;
      serie.jogos.forEach(j=>{html+=renderJogo(j);});
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });

  app.innerHTML=html;
}

// Theme toggle
const themeBtn=document.getElementById('themeBtn');
const saved=localStorage.getItem('taca_fem_theme');
if(saved){document.documentElement.setAttribute('data-theme',saved);themeBtn.textContent=saved==='dia'?'🌙':'☀️';}
themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||'noite';
  const next=cur==='dia'?'noite':'dia';
  document.documentElement.setAttribute('data-theme',next);
  themeBtn.textContent=next==='dia'?'🌙':'☀️';
  localStorage.setItem('taca_fem_theme',next);
});

render();

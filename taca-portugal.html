  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

  .hero{background:linear-gradient(135deg,#0b1220 0%,#1a0a0a 50%,#0a1a10 100%);padding:36px 28px;border-radius:16px;margin-bottom:24px;position:relative;overflow:hidden}

  .hero::after{content:"";position:absolute;bottom:-30%;left:-5%;width:300px;height:300px;background:radial-gradient(circle,rgba(0,152,70,.1),transparent 70%);pointer-events:none}
  .hero .eyebrow{font-size:12px;color:#93a1b1;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:10px}
  .hero h1{font-size:38px;font-weight:900;margin:0;letter-spacing:-1px;line-height:1.05}
  .hero h1 .lig{color:#e30613}
  .hero .lede{font-size:15px;color:#cbd5e1;margin-top:12px;max-width:760px;line-height:1.55}
  .hero .stats{display:flex;gap:24px;margin-top:22px;flex-wrap:wrap}
  .hero .stat b{display:block;font-size:26px;font-weight:800;color:#f3f4f6}
  .hero .stat span{font-size:11px;color:#93a1b1;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;display:block}

  .elim-block{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
  .elim-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .elim-title{font-size:22px;font-weight:900;color:var(--text)}
  .elim-title .n{color:#e30613}
  .elim-date{font-size:13px;color:var(--muted);font-weight:600}

  .serie-block{margin-bottom:24px}
  .serie-block:last-child{margin-bottom:0}
  .serie-head{font-size:15px;font-weight:800;color:#e30613;text-transform:uppercase;letter-spacing:1.5px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid rgba(227,6,19,.3);display:flex;align-items:center;gap:8px}
  .serie-head.sul{color:#009846;border-bottom-color:rgba(0,152,70,.3)}
  .serie-head::before{content:"";width:4px;height:16px;background:currentColor;border-radius:2px}

  .jogos{display:grid;gap:8px}
  .jogo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--bg2);padding:12px 16px;border-radius:10px;border:1px solid transparent;transition:border .15s}
  .jogo:hover{border-color:var(--line)}
  .team-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:4px}
  .mc-inline{width:100%;font-size:11px;color:#cbd5e1;line-height:1.4}
  .team-side.casa .mc-inline{text-align:right}
  .team-side.fora .mc-inline{text-align:left}
  .team-side.casa{justify-content:flex-end;text-align:right}
  .team-side.fora{justify-content:flex-start}
  .team-name{font-weight:600;font-size:14px;color:var(--text)}
  .team-logo{width:36px;height:36px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:18px}
  .score{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;min-width:100px;justify-content:center}
  .score .sep{color:var(--muted)}
  .score .vs{color:var(--muted);font-size:14px;font-weight:600}
  .score.played{color:#e30613}
  .score .v{font-size:1.4em;font-weight:700;min-width:24px;text-align:center;display:inline-block;padding:2px 6px;line-height:1;color:#fff}
  .jogo-meta{grid-column:1/4;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}

  .marcadores-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:0;font-size:11px;color:#cbd5e1;margin-top:6px;padding:8px;background:rgba(255,255,255,.02);border-radius:6px;align-items:start}
  .marcadores-wrap .mc{white-space:normal;line-height:1.5}
  .marcadores-wrap .mc.casa{padding-left:20%;padding-right:10px;text-align:right}
  .marcadores-wrap .mc.fora{padding-right:20%;padding-left:10px;text-align:left}
  .marcadores-wrap .mc.sep{color:#6b7280;font-size:12px;align-self:center}
  .marcadores-wrap .mc b{color:#f3f4f6;font-weight:500}

  /* Isentos */
  .isentos-block{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
  .isentos-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
  .isentos-subtitle{font-size:12px;color:var(--muted);margin-bottom:14px}
  .isentos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .isento-item{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
  .isento-badge{background:rgba(0,152,70,.15);color:#10b981;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:4px;white-space:nowrap}

  .footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-style:italic}

    .isento-item{font-size:12px;padding:8px 10py}

function fmt(d){
  if(!d) return "";
  const dt=new Date(d+"T00:00:00");
  const dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[dt.getDay()]}, ${dt.getDate()} ${meses[dt.getMonth()]}`;
}

function teamLogo(id){
  const t=TEAMS[id];
  if(!t) return `<span class="team-logo" style="font-size:14px;font-weight:700;color:#e30613">?</span>`;
  if(t.logo){
    return `<img src="${t.logo}" alt="${t.name}" class="team-logo" style="width:36px;height:36px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.08);padding:2px" onerror="this.outerHTML='<span class=\\'team-logo\\' style=\\'font-size:14px;font-weight:700;color:#e30613\\'>${t.name.charAt(0).toUpperCase()}</span>'">`;
  }
  const initial=t.name.charAt(0).toUpperCase();
  return `<span class="team-logo" style="font-size:14px;font-weight:700;color:#e30613;background:rgba(227,6,19,.12);border-radius:6px;width:36px;height:36px;display:flex;align-items:center;justify-content:center">${initial}</span>`;
}

function renderJogo(j){
  const tc=TEAMS[j.casa]||{name:"?"};
  const tf=TEAMS[j.fora]||{name:"?"};
  const played=j.golosCasa!==null&&j.golosFora!==null;
  const metaParts=[];
  if(j.hora) metaParts.push(`🕐 ${j.hora}`);
  if(j.data) metaParts.push(`📅 ${fmt(j.data)}`);
  if(j.pavilhao) metaParts.push(`📍 ${j.pavilhao}`);
  const mcCasa=j.marcadoresCasa||"";
  const mcFora=j.marcadoresFora||"";
  const hasMc=mcCasa||mcFora;
  return `
  <div class="jogo">
    <div class="team-side casa">
      <span class="team-name">${tc.name}</span>
      ${teamLogo(j.casa)}
    </div>
    <div class="score${played?" played":""}">
      ${played?`<span class="v">${j.golosCasa}</span><span class="sep">–</span><span class="v">${j.golosFora}</span>`:`<span class="vs">vs</span>`}
    </div>
    <div class="team-side fora">
      ${teamLogo(j.fora)}
      <span class="team-name">${tf.name}</span>
    </div>
    ${metaParts.length?`<div class="jogo-meta">${metaParts.join('<span style="color:#3b4a5c">·</span>')}</div>`:''}
    ${hasMc?`<div class="marcadores-wrap">
      <div class="mc casa">${mcCasa}</div>
      <div class="mc sep">⚽</div>
      <div class="mc fora">${mcFora}</div>
    </div>`:''}
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  let html='';

  // Isentos
  html+=`<div class="isentos-block">
    <div class="isentos-title">⭐ Equipas Isentas da 1ª Eliminatória</div>
    <div class="isentos-subtitle">As seguintes 25 equipas entram diretamente na 2ª Eliminatória:</div>
    <div class="isentos-grid">`;
  DATA.isentos.forEach(id=>{
    const t=TEAMS[id]||{name:"?"};
    html+=`<div class="isento-item"><span class="isento-badge">isenta</span>${t.name}</div>`;
  });
  html+=`</div></div>`;

  // Eliminatórias
  DATA.eliminatorias.forEach(elim=>{
    html+=`<div class="elim-block">
      <div class="elim-head">
        <div class="elim-title"><span class="n">${elim.nome}</span></div>
        ${elim.data?`<div class="elim-date">📅 ${fmt(elim.data)}</div>`:''}
      </div>`;
    elim.series.forEach(serie=>{
      html+=`<div class="serie-block">
        <div class="serie-head${serie.tipo==='sul'?' sul':''}">${serie.nome}</div>
        <div class="jogos">`;
      serie.jogos.forEach(j=>{html+=renderJogo(j);});
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });

  app.innerHTML=html;
}

// Theme toggle
const themeBtn=document.getElementById('themeBtn');
const saved=localStorage.getItem('taca_theme');
if(saved){document.documentElement.setAttribute('data-theme',saved);themeBtn.textContent=saved==='dia'?'🌙':'☀️';}
themeBtn.addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||'noite';
  const next=cur==='dia'?'noite':'dia';
  document.documentElement.setAttribute('data-theme',next);
  themeBtn.textContent=next==='dia'?'🌙':'☀️';
  localStorage.setItem('taca_theme',next);
});

render();

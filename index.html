    text-transform:uppercase;color:var(--ink-3)}
  .tabs{display:flex;flex-wrap:wrap;gap:7px}
  .tab{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink-2);
    border-radius:3px;padding:7px 12px;cursor:pointer;font-size:.84rem;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:.15s}
  .tab:hover{border-color:var(--line-2);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--navy);border-color:var(--ink)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* barras de campo, como na folha impressa */
  .strip{display:grid;gap:8px}
  .strip.two{grid-template-columns:1fr 1fr}
  @media (max-width:760px){.strip.two{grid-template-columns:1fr}}
  .fld{display:grid;grid-template-columns:minmax(96px,148px) 1fr;align-items:stretch;
    border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel)}
  .fld .k{display:flex;align-items:center;padding:8px 11px;background:var(--panel-2);
    font-size:.63rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2)}
  .fld input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92rem;
    padding:8px 11px;width:100%}
  .fld input::placeholder{color:var(--ink-3)}

  .versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
    border:1px solid var(--line);border-radius:4px;padding:14px 18px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
  .team{display:flex;align-items:center;gap:11px;min-width:0}
  .team.away{flex-direction:row-reverse;text-align:right}
  .crest{width:46px;height:46px;flex:0 0 auto;border-radius:4px;display:grid;place-items:center;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.92rem;color:#fff;letter-spacing:.03em}
  .crest img{width:100%;height:100%;object-fit:contain;display:block}
  .crest.tem{background:transparent!important}
  .av{width:26px;height:26px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:rgba(255,255,255,.09);
    border:1px solid var(--line)}
  .av.vazia{display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.05)}
  .av.vazia img{width:70%;height:70%;object-fit:contain;opacity:.42}
  td.nome .cel{display:flex;align-items:center;gap:8px;padding-left:9px}
  td.nome .cel input{padding-left:2px}
  .tt{font-weight:700;font-size:clamp(1.15rem,3vw,1.75rem);line-height:1.05;letter-spacing:.01em;overflow-wrap:anywhere}
  .sc{display:flex;align-items:center;gap:7px}
  .sc input{width:54px;height:54px;text-align:center;font-size:1.85rem;font-weight:700;
    background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line-2);border-radius:4px}
  .sc b{font-size:1.2rem;color:var(--ink-3);font-weight:500}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
    padding:8px 4px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  th.n{width:42px}th.p{width:34px}
  th.nm{text-align:left;padding-left:11px}
  td{border-bottom:1px solid rgba(255,255,255,.07);padding:0;text-align:center}
  tr:last-child td{border-bottom:0}
  td input[type="text"]{border:0;background:transparent;color:var(--ink);font:inherit;
    font-size:.86rem;padding:6px 4px;width:100%;text-align:center}
  td.nome input{text-align:left;padding-left:11px;font-size:.85rem;letter-spacing:.01em}
  td.n input{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--gold);
    font-size:.98rem;font-variant-numeric:tabular-nums}
  th.est{width:102px}
  td.est{padding:4px 5px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;max-width:100%}
  .sg{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;
    color:var(--ink-3);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;
    width:28px;padding:5px 0;cursor:pointer;transition:.12s;line-height:1;flex:0 0 auto}
  .sg:last-child{border-right:0}
  .sg:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .sg.on.p{background:var(--gold);color:#241B06}
  .sg.on.s{background:rgba(255,255,255,.9);color:var(--navy)}
  .sg.on.n{background:rgba(255,122,122,.75);color:#2A0E0E}
  .pill{display:inline-block;padding:3px 9px;border-radius:10px;font-size:.66rem;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
  .pill.p{background:var(--gold);color:#241B06}
  .pill.s{background:rgba(255,255,255,.13);color:var(--ink-2)}
  .pill.n{background:rgba(255,122,122,.16);color:var(--bad)}
  .pill.vazio{background:transparent;color:var(--ink-3)}
  tr.on-p{background:rgba(239,192,80,.09)}
  tr.on-n{opacity:.5}
  .live{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
    border:1px solid rgba(255,90,90,.4);border-radius:4px;padding:11px 14px;
    background:linear-gradient(90deg,rgba(255,70,70,.14),rgba(255,255,255,.03))}
  .live .dot{width:9px;height:9px;border-radius:50%;background:#FF4B4B;flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(255,75,75,.7);animation:pulso 1.8s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 9px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
  .live .lb{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.74rem;
    letter-spacing:.18em;text-transform:uppercase;color:#FF9E9E}
  .live .canal{font-weight:600;font-size:.9rem;color:var(--ink)}
  .live input{flex:1 1 150px;min-width:120px;border:1px solid var(--line);border-radius:3px;
    background:rgba(0,0,0,.22);color:var(--ink);font:inherit;font-size:.85rem;padding:6px 9px}
  .live input.u{flex:2 1 240px}
  .video{position:relative;width:100%;padding-top:56.25%;border:1px solid var(--line);border-radius:4px;
    overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .credito{margin:-6px 0 0;font-size:.72rem;letter-spacing:.06em;color:var(--ink-3);text-align:right}
  .btn-live{margin-left:auto;text-decoration:none;background:#FF4B4B;color:#fff;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:.82rem;padding:8px 15px;border-radius:3px;white-space:nowrap;transition:.15s}
  .btn-live:hover{background:#ff6a6a}
  tr.grp td{padding:9px 10px 5px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
  tr.grp .gt{display:flex;align-items:center;gap:9px;font-family:"Barlow Condensed",sans-serif;
    font-weight:700;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  tr.grp .gt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(239,192,80,.45),transparent)}
  tr.grp .gc{font-size:.68rem;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
  tr.grp.s .gt{color:var(--ink-2)}
  tr.grp.s .gt::after{background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
  tr.grp.n .gt{color:var(--bad)}
  tr.grp.n .gt::after{background:linear-gradient(90deg,rgba(255,122,122,.3),transparent)}
  tr.grp.s td,tr.grp.n td{padding-top:16px}

  th.g{width:104px;color:var(--gold)}
  td.gol{padding:4px 5px}
  .gcel{display:flex;align-items:center;gap:4px}
  .ag{appearance:none;flex:0 0 auto;border:1px solid rgba(255,122,122,.5);background:rgba(255,122,122,.1);
    color:var(--bad);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.72rem;
    letter-spacing:.06em;border-radius:4px;padding:6px 5px;cursor:pointer;line-height:1;transition:.12s}
  .ag:hover{background:rgba(255,122,122,.25)}
  .ag.on{background:rgba(255,122,122,.85);color:#2A0E0E;border-color:transparent}
  td.gol input.gi{width:100%;text-align:center;border:1px dashed rgba(239,192,80,.35);border-radius:4px;
    background:rgba(239,192,80,.07);color:var(--gold);
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.95rem;padding:5px 3px;
    font-variant-numeric:tabular-nums}
  td.gol input.gi:focus{border-style:solid;border-color:var(--gold);background:rgba(239,192,80,.14)}
  td.gol input.gi::placeholder{color:rgba(239,192,80,.45);font-weight:600;font-size:.7rem;
    letter-spacing:.06em;text-transform:uppercase}
  .bola{display:inline-block;padding:2px 7px;border-radius:9px;
    background:var(--gold);color:#241B06;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.78rem;
    font-variant-numeric:tabular-nums}
  .marcadores{display:flex;flex-wrap:wrap;gap:6px 12px;padding:9px 12px;border-top:1px solid var(--line);
    background:rgba(239,192,80,.06);font-size:.8rem;color:var(--ink-2)}

  .marcadores .m.ag i{font-style:normal;color:var(--bad);font-weight:700;font-size:.72rem;
    letter-spacing:.06em;text-transform:uppercase}
  .dica{margin:0;padding:7px 12px;border-top:1px solid rgba(255,255,255,.07);
    font-size:.7rem;line-height:1.4;color:var(--ink-3);background:rgba(0,0,0,.14)}
  .dica b{color:var(--gold);font-weight:700}
  .marcadores .vazio{color:var(--ink-3)}
  .marcadores .tot{margin-left:auto;color:var(--gold);font-weight:600;letter-spacing:.04em;
    font-family:"Barlow Condensed",sans-serif;font-size:.9rem}
  .cap{display:grid;grid-template-columns:minmax(96px,120px) 1fr;border-top:1px solid var(--line)}
  .cap .k{padding:8px 11px;background:var(--panel-2);font-size:.63rem;font-weight:600;
    letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center}
  .cap input{border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 11px;width:100%}

  .oficiais{text-align:center;font-size:.62rem;letter-spacing:.19em;text-transform:uppercase;
    color:var(--ink-3);margin:4px 0 -4px}
  .legend{text-align:center;font-size:.68rem;color:var(--ink-3);letter-spacing:.04em}
  .obs{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:11px 13px}
  .obs label{display:block;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:6px}
  .obs textarea{width:100%;min-height:66px;resize:vertical;background:rgba(0,0,0,.2);
    border:1px solid var(--line);border-radius:3px;color:var(--ink);font:inherit;font-size:.88rem;padding:8px 10px}

  .ro{display:block;padding:8px 11px;font-size:.92rem;color:var(--ink)}
  td .ro{padding:6px 4px;font-size:.86rem}
  td.nome .ro{text-align:left;padding-left:11px;font-size:.85rem}
  td.n .ro{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--gold);font-size:.98rem}
  .cap .ro{padding:8px 11px}
  .sc-v{width:54px;height:54px;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;
    font-size:1.85rem;font-weight:700;background:rgba(0,0,0,.3);border:1px solid var(--line-2);border-radius:4px;padding:0}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(6,12,38,.95);
    border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .bar .in{max-width:1120px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
  .status{font-size:.78rem;color:var(--ink-2);margin-right:auto}
  .btn{appearance:none;border:0;border-radius:4px;padding:9px 18px;cursor:pointer;font-size:.86rem;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#241B06}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}

  @media print{
    @page{size:A4 portrait;margin:11mm}
    body{background:#fff;color:#000}
    .bg,.mark,.bar,.tabs{display:none!important}

    .fld .k,th,.cap .k{background:#ececec;color:#333}
    .versus{background:#fff}
    .tt,.crest{color:#000}
    .crest{border:1px solid #999;background:#fff!important}
    td{border-color:#d8d8d8}

    td.mk[data-on="1"]{background:#e9e9e9}
    td.mk[data-on="1"] span,td.mk[data-on="1"].n span{color:#000}
    tr.on-p{background:#f7f2e2}
  }
  `;

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var $ = function (s) { return document.querySelector(s); };

  var BASE = JSON.parse(document.getElementById("state").textContent);
  var state = BASE;

  // as fotos são sempre as da versão publicada: nunca se perdem por causa de uma cópia antiga
  function repor(alvo) {
    var bj = {};
    BASE.jogos.forEach(function (g) { bj[g.id] = g; });
    alvo.jogos.forEach(function (g) {
      var b = bj[g.id]; if (!b) return;
      ["casa", "fora"].forEach(function (lado) {
        var mapa = {};
        b[lado].jogadores.forEach(function (p) {
          if (p.nome) mapa[p.nome.trim().toUpperCase()] = p.foto || "";
        });
        g[lado].jogadores.forEach(function (p) {
          var k = (p.nome || "").trim().toUpperCase();
          if (mapa[k]) p.foto = mapa[k];
        });
      });
    });
    return alvo;
  }

  // junta o que o utilizador escreveu com os plantéis/fotos da versão publicada
  var CAMPOS_J = ["data", "local", "hora", "jornada", "arb1", "arb2", "arb3", "cron", "obs", "tv", "tvUrl", "tvEmbed"];
  function fundir(guardado) {
    var novo = JSON.parse(document.getElementById("state").textContent);
    var gj = {};
    (guardado.jogos || []).forEach(function (g) { gj[g.id] = g; });
    if (guardado.atual) novo.atual = guardado.atual;
    novo.jogos.forEach(function (g) {
      var u = gj[g.id]; if (!u) return;
      CAMPOS_J.forEach(function (k) { if (u[k]) g[k] = u[k]; });
      ["casa", "fora"].forEach(function (lado) {
        if (!u[lado]) return;
        ["golos", "capitao", "treinador"].forEach(function (k) { if (u[lado][k]) g[lado][k] = u[lado][k]; });
        var um = {}, ul = u[lado].jogadores || [];
        ul.forEach(function (p) { if (p.nome) um[p.nome.trim().toUpperCase()] = p; });
        g[lado].jogadores.forEach(function (p, i) {
          var q = p.nome ? um[p.nome.trim().toUpperCase()] : ul[i];
          if (!q) return;
          if (!p.nome && q.nome) { p.nome = q.nome; p.num = q.num || p.num; }
          if (q.min) p.min = q.min;
          if (q.e) p.e = q.e;
        });
      });
    });
    return novo;
  }

  if (MODE === "editor" || SRV) {
    try {
      var guardado = localStorage.getItem(LS);
      if (guardado) state = fundir(JSON.parse(guardado));
    } catch (e) { /* sem localStorage: segue com o que está na página */ }
  }
  var dirty = false, saving = false, api = null;

  function jogo() {
    for (var i = 0; i < state.jogos.length; i++) if (state.jogos[i].id === state.atual) return state.jogos[i];
    return state.jogos[0];
  }

  function fld(k, attr, val, ph) {

      ? '<span class="ro">' + esc(val || "—") + "</span>"
      : "<input type=\"text\" " + attr + ' value="' + esc(val) + '" placeholder="' + esc(ph || "") + '">';
    return '<div class="fld"><span class="k">' + esc(k) + "</span>" + campo + "</div>";
  }

  var ROTULO = { P: "5 inicial", S: "Suplente", N: "Não conv." };

  function pill(e) {
    if (!e) return '<span class="pill vazio">—</span>';
    return '<span class="pill ' + e.toLowerCase() + '">' + ROTULO[e] + "</span>";
  }

  function seg(code, on) {
    return '<button type="button" class="sg ' + code.toLowerCase() + (on === code ? " on" : "") +
      '" data-mk="' + code + '" title="' + ROTULO[code] + '" aria-pressed="' + (on === code) + '">' +
      code + "</button>";
  }

  function av(p, t) {
    if (!p.foto) {
      if (t && t.logo && p.nome) {
        return '<span class="av vazia"><img src="' + esc(t.logo) + '" alt="" ' +
          "onerror=\"this.remove()\"></span>";
      }
      return '<span class="av" aria-hidden="true"></span>';
    }
    return '<img class="av" src="' + esc(p.foto) + '" alt="" loading="lazy" ' +
      "onerror=\"this.replaceWith(Object.assign(document.createElement('span'),{className:'av'}))\">";
  }

  // "6, 23" golos normais · "32a" autogolo (conta para a equipa adversária)
  function mins(p) {
    var txt = (p.min || "").toString();
    var out = [], m, re = /(\d+)\s*(a|ag)?/gi;
    while ((m = re.exec(txt)) !== null) {
      if (!m[1]) break;
      out.push({ m: m[1], ag: !!m[2] });
    }
    return out;
  }

  function minTxt(x) { return x.m + "'" + (x.ag ? " a.g." : ""); }

  function golosDe(j, lado) {
    var outro = lado === "casa" ? "fora" : "casa", ev = [];
    j[lado].jogadores.forEach(function (p) {
      if (!p.nome) return;
      mins(p).forEach(function (x) { if (!x.ag) ev.push({ nome: p.nome, m: x.m }); });
    });
    j[outro].jogadores.forEach(function (p) {
      if (!p.nome) return;
      mins(p).forEach(function (x) { if (x.ag) ev.push({ nome: p.nome, m: x.m, ag: true }); });
    });
    return ev.sort(function (a, b) { return +a.m - +b.m; });
  }

  function marcadores(j, lado) {
    var ev = golosDe(j, lado);
    if (!ev.length) return '<span class="vazio">Sem golos registados</span>';
    return ev.map(function (x) {
      return '<span class="m' + (x.ag ? " ag" : "") + '"><b>' + esc(x.nome) + "</b> " + x.m + "'" +
        (x.ag ? ' <i>a.g.</i>' : "") + "</span>";
    }).join("") + '<span class="tot">' + ev.length + (ev.length === 1 ? " golo" : " golos") + "</span>";
  }

  var GRUPOS = [
    { e: "P", cls: "p", tit: "Cinco inicial" },
    { e: "S", cls: "s", tit: "Suplentes" },
    { e: "N", cls: "n", tit: "Não convocados" }
  ];

  function linhaRO(p, t) {
    var on = p.e;
    return '<tr class="' + (on === "P" ? "on-p" : on === "N" ? "on-n" : "") + '">' +
      '<td class="n"><span class="ro num">' + esc(p.num) + '</span></td>' +
      '<td class="nome"><span class="cel">' + av(p, t) +
      '<span class="ro">' + esc(p.nome) + '</span></span></td>' +
      '<td class="gol">' + (mins(p).length
        ? mins(p).map(function (x) {
            return '<span class="bola' + (x.ag ? " ag" : "") + '">' + esc(minTxt(x)) + "</span>";
          }).join(" ")
        : "") + "</td></tr>";
  }

  function corpoRO(eq, t) {
    var conv = eq.jogadores.filter(function (p) { return p.nome; });
    var html = "";
    GRUPOS.forEach(function (g) {
      var l = conv.filter(function (p) { return (p.e || "S") === g.e; });
      if (!l.length) return;
      html += '<tr class="grp ' + g.cls + '"><td colspan="3"><span class="gt">' + g.tit +
        '<span class="gc">' + l.length + "</span></span></td></tr>";
      html += l.map(function (p) { return linhaRO(p, t); }).join("");
    });
    return html || '<tr><td colspan="3" class="vazio">Sem atletas</td></tr>';
  }

  function tabela(lado, j) {
    var eq = j[lado], t = TEAMS[eq.eq];
    var rows = RO ? corpoRO(eq, t) : eq.jogadores.map(function (p, i) {
      var on = p.e;
      return '<tr class="' + (on === "P" ? "on-p" : "") + '">' +
        '<td class="n"><input type="text" data-pf="num" data-lado="' + lado + '" data-i="' + i +
        '" value="' + esc(p.num) + '" aria-label="Número"></td>' +
        '<td class="nome"><span class="cel">' + av(p, t) +
        '<input type="text" data-pf="nome" data-lado="' + lado + '" data-i="' + i +
        '" value="' + esc(p.nome) + '" aria-label="Nome do atleta"></span></td>' +
        '<td class="est" colspan="3"><span class="seg" data-lado="' + lado + '" data-i="' + i + '">' +
          seg("P", on) + seg("S", on) + seg("N", on) + "</span></td>" +
        '<td class="gol"><span class="gcel">' +
        '<input type="text" inputmode="numeric" class="gi" data-pf="min" data-lado="' + lado +
        '" data-i="' + i + '" value="' + esc(p.min || "") + '" aria-label="Minutos dos golos" ' +
        'title="Minutos dos golos" placeholder="min">' +
        '<button type="button" class="ag' + (mins(p).some(function (x) { return x.ag; }) ? " on" : "") +
        '" data-ag="1" data-lado="' + lado + '" data-i="' + i +
        '" title="Autogolo — o golo conta para a equipa adversária">AG</button></span></td>' +
        "</tr>";
    }).join("");

    var cab = RO
      ? '<tr><th class="n">Nº</th><th class="nm">Nome do atleta</th><th class="p g">G</th></tr>'
      : '<tr><th class="n">Nº</th><th class="nm">Nome do atleta</th>' +
        '<th class="p">P</th><th class="p">S</th><th class="p">N</th><th class="p g">G</th></tr>';

    return '<section class="panel">' +
      "<table><thead>" + cab + "</thead>" +
      "<tbody>" + rows + "</tbody></table>" +
      '<div class="marcadores" data-lado="' + lado + '">' + marcadores(j, lado) + "</div>" +
      (RO ? "" : '<p class="dica">Golos: escreve os minutos (ex.: 7, 23). <b>Autogolo:</b> junta um <b>a</b> ' +
        'ao minuto (ex.: <b>32a</b>) — o golo passa para o lado da outra equipa.</p>') +
      '<div class="cap"><span class="k">Capitão</span>' +
      (RO ? '<span class="ro">' + esc(eq.capitao || "—") + "</span>"
          : '<input type="text" data-eqf="capitao" data-lado="' + lado + '" value="' + esc(eq.capitao) + '">') + "</div>" +
      "</section>";
  }

  function banco(lado, j) {
    return '<div class="fld"><span class="k">Treinador</span>' +
      (RO ? '<span class="ro">' + esc(j[lado].treinador || "—") + "</span>"
          : '<input type="text" data-eqf="treinador" data-lado="' + lado + '" value="' + esc(j[lado].treinador) + '">') + "</div>";
  }

  function directo(j) {
    var url = (j.tvUrl || "").trim(), canal = (j.tv || "").trim(), emb = (j.tvEmbed || "").trim();
    var botao = url
      ? '<a class="btn-live" href="' + esc(url) + '" target="_blank" rel="noopener">Ver em direto</a>'
      : "";
    var janela = emb
      ? '<div class="video"><iframe src="' + esc(emb) + '" allow="autoplay; fullscreen; encrypted-media" ' +
        'allowfullscreen loading="lazy" title="Transmissão em direto"></iframe></div>' +
        (canal ? '<p class="credito">Transmissão: ' + esc(canal) + "</p>" : "")
      : "";
    if (RO) {
      if (!url && !canal && !emb) return "";
      return '<div class="live"><span class="dot"></span>' +
        '<span class="lb">Transmissão em direto</span>' +
        (canal ? '<span class="canal">' + esc(canal) + "</span>" : "") +
        botao + "</div>" + janela;
    }
    return '<div class="live edit"><span class="dot"></span>' +
      '<span class="lb">Transmissão</span>' +
      '<input type="text" data-jf="tv" value="' + esc(canal) + '" placeholder="Canal / plataforma">' +
      '<input type="text" class="u" data-jf="tvUrl" value="' + esc(url) + '" placeholder="Link da notícia / transmissão">' +
      botao + "</div>" +
      '<div class="fld"><span class="k">Janela do vídeo</span>' +
      '<input type="text" data-jf="tvEmbed" value="' + esc(emb) +
      '" placeholder="Link para incorporar (embed) — deixa vazio se não houver"></div>' +
      janela;
  }

  function crest(t) {
    if (!t.logo) return '<span class="crest" style="background:' + t.cor + '">' + esc(t.curto) + "</span>";
    return '<span class="crest tem"><img src="' + esc(t.logo) + '" alt="' + esc(t.nome) + '" ' +
      "onerror=\"this.parentNode.classList.remove('tem');this.parentNode.style.background='" + t.cor +
      "';this.parentNode.textContent='" + esc(t.curto) + "'\"></span>";
  }

  function render() {
    var j = jogo(), c = TEAMS[j.casa.eq], f = TEAMS[j.fora.eq];
    var tabs = state.jogos.map(function (g) {
      return '<button class="tab" data-j="' + g.id + '" aria-selected="' + (g.id === state.atual) + '">' +
        esc(TEAMS[g.casa.eq].curto) + " × " + esc(TEAMS[g.fora.eq].curto) + " · " + esc(g.hora) + "</button>";
    }).join("");

    $("#app").innerHTML =
      '<div class="bg"><i></i><i></i></div><div class="mark"></div>' +
      '<div class="wrap">' +
        '<header class="top"><div class="brand">' +
          '<img src="' + LOGO + '" alt="Record International Masters Futsal">' +
          '<span class="sub">Ficha de jogo · ' + esc(j.jornada) + "</span></div>" +
          '<div class="tabs">' + tabs + "</div></header>" +

        '<div class="strip two">' +
          fld("Data", 'data-jf="data"', j.data) +
          fld("Local", 'data-jf="local"', j.local) +
          fld("Horário", 'data-jf="hora"', j.hora) +
          fld("Jornada", 'data-jf="jornada"', j.jornada) +
        "</div>" +

        '<div class="strip two">' +
          fld("1.º Árbitro", 'data-jf="arb1"', j.arb1) +
          fld("3.º Árbitro", 'data-jf="arb3"', j.arb3) +
          fld("2.º Árbitro", 'data-jf="arb2"', j.arb2) +
          fld("Cronometrista", 'data-jf="cron"', j.cron) +
        "</div>" +

        '<div class="versus">' +
          '<div class="team">' + crest(c) +
          '<span class="tt">' + esc(c.nome) + "</span></div>" +
          (RO
            ? '<div class="sc"><span class="ro sc-v">' + esc(j.casa.golos || "–") + '</span><b>×</b>' +
              '<span class="ro sc-v">' + esc(j.fora.golos || "–") + '</span></div>'
            : '<div class="sc"><input type="text" inputmode="numeric" data-jf="casaGolos" value="' + esc(j.casa.golos) +
              '" aria-label="Golos ' + esc(c.nome) + '"><b>×</b>' +
              '<input type="text" inputmode="numeric" data-jf="foraGolos" value="' + esc(j.fora.golos) +
              '" aria-label="Golos ' + esc(f.nome) + '"></div>') +
          '<div class="team away">' + crest(f) +
          '<span class="tt">' + esc(f.nome) + "</span></div>" +
        "</div>" +

        '<div class="grid">' + tabela("casa", j) + tabela("fora", j) + "</div>" +
        '<p class="oficiais">Oficiais no banco de suplentes</p>' +
        '<div class="strip two">' + banco("casa", j) + banco("fora", j) + "</div>" +
        '<p class="legend">P — cinco inicial &nbsp;·&nbsp; S — suplente &nbsp;·&nbsp; N — não convocado &nbsp;·&nbsp; nos golos, escreve os minutos (ex.: 7, 23) &nbsp;·&nbsp; autogolo: junta um <b>a</b> ao minuto (ex.: 32a)</p>' +
        directo(j) +
        (RO && !j.obs ? "" :
          '<div class="obs"><label for="obs">Observações</label>' +
          (RO ? '<p class="ro" style="margin:0">' + esc(j.obs) + "</p>"
              : '<textarea id="obs" data-jf="obs">' + esc(j.obs) + "</textarea>") + "</div>") +
      "</div>" +

      (RO ? "" :
        '<div class="bar"><div class="in"><span class="status" id="st"></span>' +
        (MODE === "editor" ? '<button class="btn ghost" id="dl">Só dados.json</button>' : "") +
        (SRV ? '<button class="btn ghost" id="dl">Cópia de segurança</button>' : "") +
        '<button class="btn" id="save">' + (MODE === "editor" ? "Guardar + JSON" : "Guardar") + '</button></div></div>');

    status();
  }

  function status(msg) {
    var el = $("#st"); if (!el) return;
    el.textContent = msg || (dirty ? "Alterações por guardar" : "Tudo guardado");
    var b = $("#save"); if (b) b.disabled = saving;
  }
  function sujo() { dirty = true; status(); }

  document.addEventListener("input", function (e) {
    var t = e.target, j = jogo();
    if (t.dataset.pf) {
      var alvo = j[t.dataset.lado].jogadores[+t.dataset.i];
      if (t.dataset.pf === "min") {
        alvo.min = t.value;
        ["casa", "fora"].forEach(function (l) {   // autogolo entra do outro lado
          var el = document.querySelector('.marcadores[data-lado="' + l + '"]');
          if (el) el.innerHTML = marcadores(j, l);
        });
      } else {
        alvo[t.dataset.pf] = t.value;
      }
      sujo(); return;
    }
    if (t.dataset.eqf) { j[t.dataset.lado][t.dataset.eqf] = t.value; sujo(); return; }
    if (t.dataset.jf) {
      var f = t.dataset.jf;
      if (f === "casaGolos") j.casa.golos = t.value;
      else if (f === "foraGolos") j.fora.golos = t.value;
      else j[f] = t.value;
      if (f === "jornada") { render(); dirty = true; status(); return; }
      sujo(); return;
    }
  });

  function marcar(btn) {
    var seg = btn.parentNode;
    var j = jogo(), p = j[seg.dataset.lado].jogadores[+seg.dataset.i];
    p.e = p.e === btn.dataset.mk ? "" : btn.dataset.mk;
    render(); dirty = true; status();
  }

  function alternarAG(btn) {
    var j = jogo(), p = j[btn.dataset.lado].jogadores[+btn.dataset.i];
    var txt = (p.min || "").trim();
    if (!txt) { p.min = ""; render(); dirty = true; status();
      var alvo = document.querySelector('input.gi[data-lado="' + btn.dataset.lado + '"][data-i="' + btn.dataset.i + '"]');
      if (alvo) alvo.focus();
      return; }
    var l = mins(p), tudo = l.every(function (x) { return x.ag; });
    p.min = l.map(function (x) { return x.m + (tudo ? "" : "a"); }).join(" ");
    render(); dirty = true; status();
  }

  document.addEventListener("click", function (e) {
    var ag = e.target.closest && e.target.closest("button.ag");
    if (ag) { alternarAG(ag); return; }
    var sg = e.target.closest && e.target.closest("button.sg");
    if (sg) { marcar(sg); return; }
    var tab = e.target.closest && e.target.closest(".tab");
    if (tab) { state.atual = tab.dataset.j; render(); return; }
    if (e.target.id === "print") { window.print(); return; }
    if (e.target.id === "save") { guardar(); return; }
    if (e.target.id === "dl") { descarregar(); return; }
  });

  function descarregar(msg) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }));
    a.download = "dados.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    status(msg || "dados.json descarregado — substitui-o no GitHub");
  }

  function docHtml() {
    var head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      "<title>Fichas Masters Futsal</title>" +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' +
      'family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">';
    return '<!doctype html>\n<html lang="pt"><head>' + head + "</head><body>" +
      '<div id="app"></div>' +
      '<script id="state" type="application/json">' +
      JSON.stringify(state).replace(/<\//g, "<\\/") + "<\/script>" +
      '<script id="code">' + document.getElementById("code").textContent + "<\/script></body></html>";
  }

  async function guardar() {
    if (saving) return;
    if (MODE === "editor") {
      var ok = true;
      try { localStorage.setItem(LS, JSON.stringify(state)); dirty = false; }
      catch (e) { ok = false; }
      descarregar(ok
        ? "Guardado aqui + dados.json descarregado — envia/coloca o ficheiro para ficar em direto"
        : "dados.json descarregado — envia/coloca o ficheiro para ficar em direto");
      return;
    }
    if (SRV) {
      var chave = "";
      try { chave = localStorage.getItem(LS_KEY) || ""; } catch (e) {}
      saving = true; status("A publicar…");
      try {
        var r = await fetch(SAVE_URL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chave: chave, dados: state })
        });
        var res = await r.json().catch(function () { return {}; });
        saving = false;
        if (r.ok && res.ok) {
          try { localStorage.setItem(LS_KEY, chave); localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
          dirty = false;
          status("Publicado às " + new Date().toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
        } else if (r.status === 401 || r.status === 403) {
          var nova = window.prompt("Esta pasta está protegida. Palavra-passe:") || "";
          if (nova) { try { localStorage.setItem(LS_KEY, nova); } catch (e) {} status("Carrega em Guardar outra vez"); }
          else status("Publicação cancelada");
        } else {
          status("O servidor recusou: " + (res.erro || r.status));
        }
      } catch (e) {
        saving = false;
        try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e2) {}
        status("Sem ligação — ficou guardado no dispositivo, tenta outra vez");
      }
      return;
    }
    saving = true; status("A guardar…");
    try {
      if (!api) api = await claude.use("artifact");
      if (!api) { saving = false; status("Guardar indisponível nesta vista"); return; }
      await api.publish(docHtml());
      dirty = false; saving = false; status("Guardado");
    } catch (err) {
      saving = false;
      var c = err && err.code;
      if (c === "conflict") { status("Outra pessoa guardou primeiro — a recarregar"); return; }
      if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "capability_disabled") {
        status("Esta vista é só de leitura");
        var b = $("#save"); if (b) b.style.display = "none"; return;
      }
      if (c === "rate_limited") { status("Demasiados guardares seguidos — espera uns segundos"); return; }
      status("Não foi possível guardar. Tenta de novo.");
    }
  }

  window.addEventListener("beforeunload", function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  var st = document.createElement("style");
  st.textContent = CSS;
  document.head.appendChild(st);
  render();

  if (RO) {
    var assinatura = JSON.stringify(state);
    var buscar = function () {
      fetch("dados.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (novo) {
          if (!novo) return;
          var s2 = JSON.stringify(novo);
          if (s2 === assinatura) return;
          assinatura = s2;
          var atual = state.atual;
          state = repor(novo); state.atual = atual;
          render();
        })
        .catch(function () {});
    };
    buscar();
    setInterval(buscar, POLL);
  }
})();
</script>
</body></html>

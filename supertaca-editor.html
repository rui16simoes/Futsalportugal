/* elementos gráficos do cartaz */
.art{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.art span{position:absolute;display:block}
.art.foto{background-size:cover;background-position:center top;background-repeat:no-repeat}
.art.foto::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,10,13,.80),rgba(9,10,13,.90) 45%,rgba(9,10,13,.95));
}
.sh{background:rgba(255,255,255,.05)}
.sh1{top:-8%;left:-4%;width:42vw;height:120%;clip-path:polygon(0 0,60% 0,16% 100%,0 100%)}
.sh2{top:-8%;right:-6%;width:46vw;height:118%;clip-path:polygon(40% 0,100% 0,100% 44%,64% 100%)}
.sh3{top:-8%;left:34vw;width:22vw;height:120%;clip-path:polygon(52% 0,100% 0,48% 100%,0 100%);opacity:.7}
.cx{
  top:8vh;left:5vw;width:clamp(70px,12vw,140px);height:clamp(70px,12vw,140px);
  transform:rotate(-9deg);opacity:.42;
}
.cx::before,.cx::after{content:"";position:absolute;background:#e2201b;border-radius:3px}
.cx::before{left:0;right:0;top:38%;height:24%}
.cx::after{top:0;bottom:0;left:38%;width:24%}
.ar{background:#00b455}
.ar1{top:0;right:3vw;width:clamp(70px,13vw,180px);height:clamp(150px,26vh,300px);
  clip-path:polygon(24% 0,100% 0,100% 26%,58% 100%,6% 100%);opacity:.30}
.ar2{top:34vh;right:8vw;width:clamp(46px,8vw,110px);height:clamp(90px,16vh,190px);
  clip-path:polygon(28% 0,100% 0,64% 100%,0 100%);opacity:.22}
.rg{
  bottom:10vh;right:5vw;width:clamp(110px,20vw,240px);height:clamp(110px,20vw,240px);
  border:clamp(14px,2.6vw,30px) solid rgba(0,180,85,.20);border-radius:50%;
}
.wrap{max-width:1080px;margin:0 auto;padding:14px 12px 40px;position:relative;z-index:2}

/* cabeçalho */
.top{text-align:center;padding:10px 0 6px}
.brand{
  display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);color:#fff;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:7px 16px;margin:0 auto 10px;
  font:700 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.18em;text-transform:uppercase;
}
.brand i{width:5px;height:5px;border-radius:50%;background:#e2201b;display:inline-block}
.top h1{
  margin:0;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:900;font-style:italic;
  font-size:clamp(34px,9.5vw,68px);line-height:.88;letter-spacing:-.005em;
  text-transform:uppercase;color:#fff;
}
.top h1 em{font-style:italic}
.top h1 span{
  -webkit-text-stroke:2.5px #e8c14a;color:transparent;margin-left:.10em;
  font-size:1.22em;line-height:.8;
}
.top .sub{
  margin:8px 0 0;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;
  letter-spacing:.10em;text-transform:uppercase;font-size:clamp(11px,3vw,14px);color:#8d939d;
}

/* separadores de jogo */
.tabs{display:flex;gap:8px;margin:14px 0 12px;justify-content:center;flex-wrap:wrap}
.tab{
  flex:1 1 190px;max-width:280px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);
  border-radius:10px;padding:9px 12px;display:grid;gap:1px;font:inherit;color:#cfd3d9;
}
.tab .tt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d838d;font-weight:600}
.tab .tj{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.05;color:#fff}
.tab .th2{font-size:12px;color:#8d939d;font-weight:600}
.tab.on{background:rgba(226,32,27,.14);border-color:rgba(226,32,27,.55);color:#fff}
.tab.on .tt{color:#ff6b62}

/* placar */
.board{
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.10);border-radius:14px;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:16px 14px;
}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.side .nm{
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(14px,3.4vw,22px);line-height:1;text-align:center;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.crest{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em;
}
.crest.tem{background:transparent!important}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.mid{display:grid;justify-items:center;gap:8px}
.sc{
  display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",Barlow,sans-serif;
  font-weight:700;font-size:clamp(38px,11vw,64px);line-height:.9;color:#fff;
}
.sc b{font-size:.42em;color:#5e646d;font-weight:600}

/* faltas */
.fouls{display:flex;align-items:center;gap:5px;margin-top:2px}
.fouls .lb{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7d838d;font-weight:700}
.fouls .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);display:inline-block}
.fouls .dot.on{background:#e8c14a}
.fouls .bon{
  font-size:9.5px;font-weight:800;letter-spacing:.08em;background:#e2201b;color:#fff;
  border-radius:4px;padding:2px 5px;text-transform:uppercase;
}
.fouls .fb{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e6e4df;
  border-radius:6px;font:700 11px Barlow,sans-serif;padding:3px 7px;cursor:pointer;
}
.fouls .fb:hover{background:rgba(255,255,255,.12)}

/* relógio */
.clock{display:grid;justify-items:center;gap:4px}
.clock .fase{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8d939d;font-weight:700}
.clock .tm{
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:28px;
  background:#000;color:#e8c14a;border:1px solid rgba(232,193,74,.35);
  border-radius:8px;padding:2px 14px;letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
.clock.run .tm{color:#fff;background:#e2201b;border-color:#e2201b}
.clock.fim .tm{color:#8d939d}
.partes{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.partes button{
  font:700 11px/1 Barlow,sans-serif;padding:6px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#9aa0aa;cursor:pointer;
}
.partes button.on{background:#e8c14a;border-color:#e8c14a;color:#191919}
.clock .ctr{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.clock .ctr button{
  font:600 12px/1 Barlow,sans-serif;padding:7px 10px;border-radius:7px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e6e4df;cursor:pointer;
}
.clock .ctr button:hover{background:rgba(255,255,255,.13)}
.clock .aj{display:flex;align-items:center;gap:4px;font-size:11px;color:#8d939d}
.clock .aj input{width:64px;padding:6px;border:1px solid rgba(255,255,255,.16);border-radius:7px;font:inherit;background:#111318;color:#fff}

.meta{text-align:center;margin:10px 0 0;font-size:12.5px;color:#8d939d}

/* transmissão em direto */
.live{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;
  background:linear-gradient(90deg,rgba(226,32,27,.30),rgba(226,32,27,.10));
  border:1px solid rgba(226,32,27,.45);border-radius:10px;
}
.live .dot{width:9px;height:9px;border-radius:50%;background:#ff3b30;flex:none;animation:pulsa 1.4s infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
.live .lb{font:700 11px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.live .canal{font-size:12.5px;color:#f0c9c7}
.live input{
  flex:1 1 150px;min-width:0;padding:7px;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;background:#12151a;color:#fff;font:inherit;font-size:13px;
}
.live .btn-live{
  margin-left:auto;background:#fff;color:#b8100c;text-decoration:none;border-radius:7px;
  padding:7px 13px;font:700 12.5px Barlow,sans-serif;white-space:nowrap;
}

/* fotografias */
.av{
  width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;display:inline-block;
  background:rgba(255,255,255,.09);vertical-align:middle;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.topo{background-size:190% auto;background-position:50% 0;background-repeat:no-repeat}
.lst .nm{display:flex;align-items:center;gap:8px}

/* assistências */
.assi{
  display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);color:#b7bcc4;
  border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:1px 6px 1px 4px;
  font-size:11.5px;font-weight:700;margin-left:3px;
}

.ev.asst .mm{color:#6aa8ec}

/* campos do editor */
.camps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.camps label,.fl label{display:grid;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7d838d;font-weight:600}
.camps input,.fl input{padding:8px;border:1px solid rgba(255,255,255,.14);border-radius:8px;font:inherit;background:#12151a;color:#fff}

/* caixas */
.relbox,.team,.gp{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.10);border-radius:14px;
}
.relbox{margin-top:16px;padding:14px}
.relbox h3,.gp h3{
  margin:0 0 10px;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:17px;color:#fff;
}
.addl{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.addl .lm{width:58px}
.addl .lt{flex:1 1 220px;min-width:0}
.addl input,.addl select{padding:9px;border:1px solid rgba(255,255,255,.14);border-radius:8px;font:inherit;background:#12151a;color:#fff}
.addl button{padding:9px 14px;border:0;border-radius:8px;background:#e2201b;color:#fff;font:600 14px Barlow,sans-serif;cursor:pointer}
.rel{list-style:none;margin:0;padding:0}
.ev{
  display:grid;grid-template-columns:46px 42px 1fr auto;gap:8px;align-items:center;
  padding:9px 4px;border-top:1px solid rgba(255,255,255,.07);
}
.ev:first-child{border-top:0}
.ev .mm{
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:18px;
  font-variant-numeric:tabular-nums;color:#fff;
}
.ev .eqp{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.08);border-radius:5px;padding:3px 5px;text-align:center;color:#b7bcc4;
}
.ev .tx{font-size:14px;color:#dcdad5}
.ev.golo .tx,.ev.ag .tx{font-weight:600;color:#fff}
.ev.golo .mm{color:#00b455}
.ev.ag .mm{color:#ff6b62}
.ev.ca .mm{color:#f2c200}
.ev.cv .mm,.ev.cd .mm{color:#ff6b62}
.ev.falta .mm{color:#e8c14a}
.ev.falta .tx{color:#b7bcc4}
.ev .del{border:0;background:none;color:#6b7079;font-size:18px;cursor:pointer;line-height:1}
.vazio{color:#7d838d;font-size:13px;margin:4px 0}

/* equipas */
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.team{padding:12px;min-width:0}
.th{display:flex;align-items:center;gap:9px;padding-bottom:9px;border-bottom:3px solid var(--cor,#e2201b)}
.th .crest{width:34px;height:34px;font-size:11px}
.th .tn{
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;text-transform:uppercase;
  font-size:18px;line-height:1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lst{width:100%;border-collapse:collapse;margin-top:6px}

.cart{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;margin-left:3px;color:#b7bcc4}
.cart i{width:8px;height:11px;border-radius:1px;display:inline-block;background:#f2c200}
.cart.v i{background:#e2201b}
.cart.d i{background:linear-gradient(135deg,#f2c200 0 50%,#e2201b 50% 100%)}
.tr{margin:9px 0 0;font-size:12.5px;color:#9aa0aa;display:flex;align-items:center;gap:8px}
.tr .av{width:30px;height:30px}
.tr b{color:#e6e4df}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.fl .lin{display:flex;align-items:center;gap:7px}
.fl .lin .av{width:30px;height:30px;flex:none}
.fl .lin input{flex:1;min-width:0}
.est .seg{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:7px;overflow:hidden}
.est .seg button{border:0;background:rgba(255,255,255,.04);padding:5px 8px;font:700 11px Barlow,sans-serif;cursor:pointer;color:#8d939d}
.est .seg button.on{background:#e2201b;color:#fff}
.lst.edt input.mi{width:82px;padding:6px;border:1px solid rgba(255,255,255,.14);border-radius:7px;font:inherit;background:#12151a;color:#fff}
.lst.edt input.nui{
  width:42px;padding:5px;border:1px solid rgba(255,255,255,.14);border-radius:7px;
  background:#12151a;color:#fff;font:700 13px Barlow,sans-serif;text-align:center;
}
.lst.edt .nu{width:48px}
.acs{display:flex;gap:2px}
.addl.editar{padding:6px;border:1px solid rgba(232,193,74,.45);border-radius:10px;background:rgba(232,193,74,.06)}
.addl .canc{background:rgba(255,255,255,.10);color:#b7bcc4;font-weight:600}

/* grandes penalidades */
.gp{margin-top:16px;padding:14px;position:relative}
.gpx{
  position:absolute;top:12px;right:12px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#9aa0aa;border-radius:7px;
  font:600 11px Barlow,sans-serif;padding:5px 9px;cursor:pointer;
}
.gpoff{margin-top:16px;text-align:center}
.gpoff button{
  border:1px dashed rgba(255,255,255,.20);background:rgba(255,255,255,.04);color:#8d939d;
  border-radius:10px;padding:11px 16px;font:600 13px Barlow,sans-serif;cursor:pointer;
}
.gpoff button:hover{color:#e6e4df;border-color:rgba(255,255,255,.35)}
.gpw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gph .crest{width:26px;height:26px;font-size:9px}
.gph span{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;text-transform:uppercase;font-size:15px;color:#fff}
.gph b{margin-left:auto;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px;color:#e8c14a}
.pen{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid rgba(255,255,255,.06)}
.pen .pn{flex:1;font-size:13px;color:#9aa0aa}
.pen input{flex:1;min-width:0;padding:6px;border:1px solid rgba(255,255,255,.14);border-radius:7px;font:inherit;background:#12151a;color:#fff}
.pen .mk{
  width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);font:700 13px Barlow,sans-serif;cursor:pointer;color:#8d939d;flex:none;
}
.pen.ok .mk{background:#00b455;border-color:#00b455;color:#fff}
.pen.no .mk{background:#e2201b;border-color:#e2201b;color:#fff}
.pen.ok .pn{color:#fff;font-weight:600}

/* barra de guardar */
.barra{
  position:sticky;bottom:0;margin-top:16px;padding:10px;background:rgba(12,13,16,.94);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  backdrop-filter:blur(6px);
}
.barra button{padding:11px 16px;border:0;border-radius:9px;background:#e2201b;color:#fff;font:700 14px Barlow,sans-serif;cursor:pointer}
.barra button.sec{background:rgba(255,255,255,.10);color:#e6e4df;border:1px solid rgba(255,255,255,.16);padding:9px 13px;font-size:13px}
.barra button.sec.on{background:#e2201b;border-color:#e2201b;color:#fff}
.barra .auto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#b7bcc4}
.barra .tok{
  width:190px;padding:9px;border:1px solid rgba(255,255,255,.16);border-radius:8px;
  background:#12151a;color:#fff;font:inherit;font-size:13px;
}
.barra .gst{font-size:12px;color:#9aa0aa;flex:1 1 180px}
.barra .gst.ok{color:#4ade8a}
.barra .gst.erro{color:#ff8a83}
.barra .dica{font-size:11px;color:#6b7079;flex:1 1 100%}

.legenda{
  margin-top:16px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.09);
}
.legenda h4{
  margin:0 0 8px;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:#8d939d;
}
.legenda ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px}
.legenda li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#b7bcc4}
.legenda .bola,.legenda .cart,.legenda .assi{margin-left:0}
.legenda .lgd{display:inline-flex;gap:3px;align-items:center}
.legenda .lgd .dot{
  width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);display:inline-block;
}
.legenda .lgd .dot.on{background:#e8c14a}
.fim{margin-top:22px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5e646d}

@media (max-width:760px){
  .times,.gpw{grid-template-columns:1fr}
  .fl{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{padding:10px 9px 34px}
  .board{grid-template-columns:1fr auto 1fr;gap:6px;padding:12px 8px}
  .crest{width:48px;height:48px}
  .side .nm{font-size:12.5px;white-space:normal;line-height:1.05}
  .fouls .lb{display:none}
  .tab{flex:1 1 46%;padding:7px 9px}
  .tab .tj{font-size:16px}
  .ev{grid-template-columns:40px 38px 1fr auto;gap:6px}
  .ev .tx{font-size:13px}
  .lst .nm{font-size:12.5px}
}
</style>

  /* ---------- golos e cartões ---------- */
  function mins(p) {
    var r = [], m, re = /(\d+)\s*(a|ag)?/gi, s = p.min || "";
    while ((m = re.exec(s))) r.push({ m: +m[1], ag: !!m[2] });
    return r;
  }
  function carts(p) {
    var r = [], m, re = /(\d+)\s*(vv|d|v|r)?/gi, s = p.cart || "";
    while ((m = re.exec(s))) {
      var t = (m[2] || "").toLowerCase();
      r.push({ m: +m[1], v: t === "v" || t === "r", d: t === "d" || t === "vv" });
    }
    return r;
  }
  function golosDe(j, lado) {
    var outro = lado === "casa" ? "fora" : "casa", ev = [];
    j[lado].jogadores.forEach(function (p) {
      if (!p.nome) return;
      mins(p).forEach(function (x) { if (!x.ag) ev.push({ m: x.m, nome: p.nome, ag: false, lado: lado }); });
    });
    j[outro].jogadores.forEach(function (p) {
      if (!p.nome) return;
      mins(p).forEach(function (x) { if (x.ag) ev.push({ m: x.m, nome: p.nome, ag: true, lado: outro }); });
    });
    ev.sort(function (a, b) { return a.m - b.m; });
    return ev;
  }
  function placar(j, lado) { return golosDe(j, lado).length; }

  /* ---------- relógio (contagem decrescente) ---------- */
  var PARTES = [
    { n: 1, lab: "1.ª PARTE", dur: 20 * 60, base: 0 },
    { n: 2, lab: "2.ª PARTE", dur: 20 * 60, base: 20 },
    { n: 3, lab: "PROLONGAMENTO · 1.ª PARTE", dur: 5 * 60, base: 40 },
    { n: 4, lab: "PROLONGAMENTO · 2.ª PARTE", dur: 5 * 60, base: 45 }
  ];
  function parteDe(n) { return PARTES[Math.min(Math.max((n || 1) - 1, 0), 3)]; }
  function rel(j) {
    return j.relogio || (j.relogio = { estado: "parado", parte: 1, acc: 0, desde: 0 });
  }
  function decorrido(j) {
    var r = rel(j), s = r.acc || 0;
    if (r.desde) s += (Date.now() - r.desde) / 1000;

  }
  function restante(j) { return parteDe(rel(j).parte).dur - decorrido(j); }

    s = Math.max(0, Math.ceil(s));

  }
  function b64(str) {
    var b = new TextEncoder().encode(str), s = "";

  }
  function horas() {
    var d = new Date();

  function publicar() {
    var tk = chaveGH();

    if (aPublicar) { agendar(); return; }
    aPublicar = true;
    estado("A publicar…");
    state.ts = Date.now();
    ls(CHAVE, JSON.stringify(state));
    var out = clone(state); out.build = BUILD;
    var txt = JSON.stringify(out, null, 1);
    var api = "https://api.github.com/repos/" + GH_REPO + "/contents/" + GH_PATH;
    var h = { Authorization: "Bearer " + tk, Accept: "application/vnd.github+json" };
    fetch(api + "?ref=main&t=" + Date.now(), { headers: h, cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (d) {
        return fetch(api, {
          method: "PUT", headers: h,
          body: JSON.stringify({ message: "ficha supertaça " + horas(), content: b64(txt), sha: d.sha })

        estado("Publicado às " + horas() + " · online dentro de ~1 minuto", "ok");

      .then(function () { aPublicar = false; });

        '<div class="camps">' +
        '<label>Data <input data-jf="data" value="' + esc(j.data) + '"></label>' +
        '<label>Hora <input data-jf="hora" value="' + esc(j.hora) + '"></label>' +
        '<label>Pavilhão <input data-jf="local" value="' + esc(j.local) + '"></label>' +
        '<label>Árbitro 1 <input data-jf="arb1" value="' + esc(j.arb1) + '"></label>' +
        '<label>Árbitro 2 <input data-jf="arb2" value="' + esc(j.arb2) + '"></label>' +
        '<label>3.º árbitro <input data-jf="arb3" value="' + esc(j.arb3) + '"></label>' +
        '<label>Cronometrista <input data-jf="cron" value="' + esc(j.cron) + '"></label>' +
        "</div>") +

      '<section class="relbox"><h3>Incidências do jogo</h3>' +
      (RO ? "" : (function () {
        var alvo = null;
        (j.lances || []).forEach(function (l) { if (l.id === editando) alvo = l; });
        return '<div class="addl' + (alvo ? " editar" : "") + '">' +
          '<input id="lm" class="lm" value="' + esc(alvo ? alvo.m : minutoAtual(j)) + '" inputmode="numeric">' +
          '<select id="ll"><option value="">—</option>' +
          '<option value="casa"' + (alvo && alvo.lado === "casa" ? " selected" : "") + ">" + esc(ca.curto) + "</option>" +
          '<option value="fora"' + (alvo && alvo.lado === "fora" ? " selected" : "") + ">" + esc(fo.curto) + "</option></select>" +
          '<input id="lt" class="lt" value="' + esc(alvo ? alvo.txt : "") +
          '" placeholder="o que aconteceu (ex.: defesa de Ana Catarina)">' +
          '<button type="button" id="addl">' + (alvo ? "Guardar" : "Juntar") + "</button>" +
          (alvo ? '<button type="button" id="canl" class="canc">cancelar</button>' : "") + "</div>";
      })()) +
      relatoHtml(j) + "</section>" +

      '<section class="times">' + (RO ? equipaRO(j, "casa") + equipaRO(j, "fora")
        : equipaED(j, "casa") + equipaED(j, "fora")) + "</section>" +

      gpHtml(j) +

      (RO ? "" : '<div class="barra">' +
        '<button type="button" id="btpub">Publicar agora</button>' +
        '<label class="auto"><input type="checkbox" id="chauto"' + (ls(K_AUTO) === "0" ? "" : " checked") +
        "> publicar sozinho</label>" +
        '<input type="password" id="gtoken" class="tok" placeholder="chave do GitHub" value="' + (chaveGH() ? "••••••••" : "") + '">' +
        '<button type="button" id="btkey" class="sec">Guardar chave</button>' +
        '<button type="button" id="btsave" class="sec">Transferir JSON</button>' +
        '<span class="gst" id="gstatus">' + (chaveGH() ? "Chave guardada." : "Cola a chave do GitHub para publicar sozinho.") + "</span>" +
        '<span class="dica">Golos e assistências: minutos separados por vírgula (7, 23) · autogolo: 32a · Cartões: 25 amarelo, 30v vermelho, 38d duplo amarelo</span></div>') +

      '<section class="legenda"><h4>Legenda</h4><ul>' +
      '<li><span class="bola"><i></i></span> Golo</li>' +
      '<li><span class="bola ag"><i></i></span> Autogolo (conta para a equipa contrária)</li>' +
      '<li><span class="assi"><i class="bota"></i></span> Assistência</li>' +
      '<li><span class="cart a"><i></i></span> Cartão amarelo</li>' +
      '<li><span class="cart v"><i></i></span> Cartão vermelho</li>' +
      '<li><span class="cart d"><i></i></span> Duplo amarelo</li>' +
      '<li><span class="lgd"><b class="dot on"></b><b class="dot on"></b><b class="dot"></b></span> Faltas acumuladas da parte (à 5.ª a equipa fica em bónus)</li>' +
      '</ul></section>' +

      '<footer class="fim">Ficha de jogo ZonaTécnica · Futsal Portugal</footer>' +
      "</div>";

    document.getElementById("app").innerHTML = html;
    ligar();
  }

  /* ---------- eventos ---------- */
  function ligar() {
    var app = document.getElementById("app");
    var j = jogoDe(state, atual);

    app.querySelectorAll("[data-j]").forEach(function (b) {
      b.onclick = function () {
        atual = b.getAttribute("data-j");
        state.atual = atual;
        if (!RO) marcar();
        render();
      };
    });

    if (RO) return;

    app.querySelectorAll("[data-e]").forEach(function (b) {
      b.onclick = function () {
        var l = b.getAttribute("data-l"), i = +b.getAttribute("data-i"), v = b.getAttribute("data-e");
        var p = j[l].jogadores[i];
        p.e = p.e === v ? "" : v;
        marcar(); render();
      };
    });

    app.querySelectorAll("input.mi, input.nui").forEach(function (inp) {
      inp.oninput = function () {
        var l = inp.getAttribute("data-l"), i = +inp.getAttribute("data-i"), f = inp.getAttribute("data-f");
        j[l].jogadores[i][f] = inp.value;
        marcar();
        var s = document.querySelector(".sc");
        if (s) s.innerHTML = "<span>" + placar(j, "casa") + "</span><b>×</b><span>" + placar(j, "fora") + "</span>";
      };
      inp.onblur = function () { render(); };
    });

    app.querySelectorAll("[data-jf]").forEach(function (inp) {
      inp.oninput = function () {
        var f = inp.getAttribute("data-jf");
        if (f.indexOf(".") > 0) { var p = f.split("."); j[p[0]][p[1]] = inp.value; }
        else j[f] = inp.value;
        marcar();
      };
    });

    app.querySelectorAll("[data-gpn]").forEach(function (inp) {
      inp.oninput = function () {
        var p = inp.getAttribute("data-gpn").split(":");
        j.gp[p[0]][+p[1]].nome = inp.value; marcar();
      };
    });
    app.querySelectorAll("[data-gpr]").forEach(function (b) {
      b.onclick = function () {
        var p = b.getAttribute("data-gpr").split(":"), o = j.gp[p[0]][+p[1]];
        o.ok = o.ok === "1" ? "0" : o.ok === "0" ? "" : "1";
        marcar(); render();
      };
    });

    app.querySelectorAll("[data-rl]").forEach(function (b) {
      b.onclick = function () {
        var r = rel(j), a = b.getAttribute("data-rl");
        if (a === "ini") {
          if (r.desde) { r.acc = decorrido(j); r.desde = 0; r.estado = "parado"; }
          else { r.acc = decorrido(j); r.desde = Date.now(); r.estado = "a_correr"; }
        } else if (a === "int") {
          r.acc = decorrido(j); r.desde = 0; r.estado = "intervalo";
        } else if (a === "fim") {
          r.acc = decorrido(j); r.desde = 0; r.estado = "final";
        } else if (a === "zero") {
          r.acc = 0; r.desde = 0; r.estado = "parado";
        } else if (a === "set") {
          var v = (document.getElementById("ajuste") || {}).value || "";
          var m = v.match(/(\d+)\s*[:.]?\s*(\d{1,2})?/);
          if (m) {
            var falta = (+m[1]) * 60 + (+(m[2] || 0));
            r.acc = Math.max(0, parteDe(r.parte).dur - falta);
            if (r.desde) r.desde = Date.now();
          }
        }
        marcar(); render();
      };
    });

    app.querySelectorAll("[data-pt]").forEach(function (b) {
      b.onclick = function () {
        var r = rel(j);
        r.parte = +b.getAttribute("data-pt");
        r.acc = 0; r.desde = 0; r.estado = "parado";
        marcar(); render();
      };
    });

    app.querySelectorAll("[data-fa]").forEach(function (b) {
      b.onclick = function () {
        var lado = b.getAttribute("data-fa"), p = rel(j).parte;
        j.faltas = j.faltas || [];
        j.faltas.push({
          id: "f" + Date.now(), lado: lado, parte: p, m: minutoAtual(j),
          n: faltasDe(j, lado, p).length + 1
        });
        marcar(); render();
      };
    });
    app.querySelectorAll("[data-fx]").forEach(function (b) {
      b.onclick = function () {
        var lado = b.getAttribute("data-fx"), p = rel(j).parte;
        var lista = faltasDe(j, lado, p);
        if (!lista.length) return;
        var ult = lista[lista.length - 1];
        j.faltas = j.faltas.filter(function (f) { return f.id !== ult.id; });
        marcar(); render();
      };
    });

    var add = document.getElementById("addl");
    if (add) add.onclick = function () {
      var t = (document.getElementById("lt").value || "").trim();
      if (!t) return;
      var m = +(document.getElementById("lm").value || minutoAtual(j));
      var lado = document.getElementById("ll").value;
      j.lances = j.lances || [];
      if (editando) {
        j.lances.forEach(function (l) { if (l.id === editando) { l.m = m; l.lado = lado; l.txt = t; } });
        editando = null;
      } else {
        j.lances.push({ id: "l" + Date.now(), m: m, lado: lado, txt: t });
      }
      marcar(); render();
    };
    var can = document.getElementById("canl");
    if (can) can.onclick = function () { editando = null; render(); };
    app.querySelectorAll("[data-ed]").forEach(function (b) {
      b.onclick = function () {
        editando = b.getAttribute("data-ed");
        render();
        var el = document.getElementById("lt"); if (el) el.focus();
      };
    });
    app.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-del");
        j.lances = (j.lances || []).filter(function (l) { return l.id !== id; });
        marcar(); render();
      };
    });

    var bs = document.getElementById("btsave");
    if (bs) { bs.onclick = guardar; if (sujo) bs.classList.add("on"); }

    var gon = document.getElementById("gpon");
    if (gon) gon.onclick = function () { j.gpOn = true; marcar(); render(); };
    var goff = document.getElementById("gpoff");
    if (goff) goff.onclick = function () {
      j.gpOn = false;
      j.gp = { casa: [], fora: [] };
      for (var i = 0; i < 5; i++) { j.gp.casa.push({ nome: "", ok: "" }); j.gp.fora.push({ nome: "", ok: "" }); }
      marcar(); render();
    };

    var bp = document.getElementById("btpub");
    if (bp) bp.onclick = publicar;

    var bk = document.getElementById("btkey");
    if (bk) bk.onclick = function () {
      var v = (document.getElementById("gtoken").value || "").trim();
      if (!v || v.indexOf("•") === 0) { estado("Cola a chave primeiro.", "erro"); return; }
      ls(K_TOKEN, v); ls("gh_token", v);
      document.getElementById("gtoken").value = "••••••••";
      estado("Chave guardada neste navegador.", "ok");
    };

    var ca = document.getElementById("chauto");
    if (ca) ca.onchange = function () {
      ls(K_AUTO, ca.checked ? "1" : "0");
      estado(ca.checked ? "Publicação automática ligada." : "Publicação automática desligada.");
    };
  }

  /* ---------- relógio a andar ---------- */
  setInterval(function () {
    var j = jogoDe(state, atual), r = rel(j), el = document.getElementById("tm");
    if (el) el.textContent = mmss(restante(j));
    if (r.desde && decorrido(j) >= parteDe(r.parte).dur) {
      r.acc = parteDe(r.parte).dur; r.desde = 0; r.estado = "parado";
      if (!RO) marcar();
      render();
    }
    var lm = document.getElementById("lm");
    if (lm && document.activeElement !== lm && rel(j).desde) lm.value = minutoAtual(j);
  }, 1000);

  /* ---------- viewer: sondar o JSON ---------- */
  if (RO) {
    setInterval(function () {
      fetch(ARQ + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (novo) {
          if (novo.build && BUILD && novo.build !== BUILD) {
            var u = location.href.split("#")[0].replace(/([?&])b=[^&]*/, "$1");
            location.replace(u + (u.indexOf("?") < 0 ? "?" : "&") + "b=" + encodeURIComponent(novo.build));
            return;
          }
          if ((novo.ts || 0) > (state.ts || 0)) {
            state = fundir(novo, BASE);
            state.ts = novo.ts;
            render();
          }
        })["catch"](function () { });
    }, 10000);
  }

  render();
})();
</script>
</body></html>

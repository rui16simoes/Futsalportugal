<script>
// Auto-update: verifica version.txt e força reload se houver nova versão
(function(){
  const CURRENT = "1787853443";
  const KEY = "app_ver";
  async function check(){
    try{
      const r = await fetch("./version.txt?_="+Date.now(), {cache:"no-store"});
      const remote = (await r.text()).trim();
      const local = localStorage.getItem(KEY);
      if(local && remote !== local){
        localStorage.setItem(KEY, remote);
        console.log("Nova versão detectada:", remote, "vs", local, "- reload");
        location.reload();
        return;
      }
      if(!local) localStorage.setItem(KEY, remote);
    }catch(e){ console.warn("version check:", e); }
  }
  check();
  // Também ao voltar (background → foreground)
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") check(); });
})();
</script>

  }
  return JSON.parse(JSON.stringify(INITIAL_DATA));

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}
function jornadaDateLabel(dj){
  return fmtDate(dj.data) || "";
}

function jogoHtml(j, gi, jogo, dj){
  const casa = TEAMS[jogo.casa]; const fora = TEAMS[jogo.fora];
  const played = jogo.golosCasa != null && jogo.golosFora != null;
  const gc = jogo.golosCasa === null ? "" : jogo.golosCasa;
  const gf = jogo.golosFora === null ? "" : jogo.golosFora;
  const scoreClass = played ? "played" : "";
  const ro = IS_ADMIN ? "" : "readonly";
  return `<div class="jogo">
    <div class="team-side casa">
      <span class="team-name">${esc(casa.name)}</span>
      <img class="team-logo" src="${esc(casa.logo)}" alt="" onerror="this.style.display='none'">
      ${jogo.marcadoresCasa ? `<div class="mc-inline">${esc(jogo.marcadoresCasa)}</div>` : ''}
    </div>
    <div class="score ${scoreClass}">
      ${IS_ADMIN ? `<input type="number" min="0" max="99" value="${gc}" onchange="setGolo(${j},${gi},'casa',this.value)" style="border-color:${casa.color}">` : `<span class="v">${gc}</span>`}
      <span class="sep">${played ? '–' : 'vs'}</span>
      ${IS_ADMIN ? `<input type="number" min="0" max="99" value="${gf}" onchange="setGolo(${j},${gi},'fora',this.value)" style="border-color:${fora.color}">` : `<span class="v">${gf}</span>`}
    </div>
    <div class="team-side fora">
      <img class="team-logo" src="${esc(fora.logo)}" alt="" onerror="this.style.display='none'">
      <span class="team-name">${esc(fora.name)}</span>
      ${jogo.marcadoresFora ? `<div class="mc-inline">${esc(jogo.marcadoresFora)}</div>` : ''}
    </div>
    ${IS_ADMIN ? `<div class="jogo-meta">
      <span>🕐 <input type="time" value="${esc(jogo.hora||'')}" onchange="setMeta(${j},${gi},'hora',this.value)" style="width:80px"></span>
      <span>📍 <input type="text" value="${esc(jogo.pavilhao||'')}" placeholder="Pavilhão" onchange="setMeta(${j},${gi},'pavilhao',this.value)" style="flex:1;min-width:120px"></span>
    </div>` : `<div class="jogo-meta"><span>📅 ${fmtDateShort(jogo.data||dj.data)}</span>${jogo.hora?`<span>🕐 ${esc(jogo.hora)}</span>`:''}${jogo.pavilhao?`<span>📍 ${MAPS[jogo.pavilhao]?`<a href="${esc(MAPS[jogo.pavilhao])}" target="_blank" rel="noopener" style="color:#93c5fd;text-decoration:none">${esc(jogo.pavilhao)} ↗</a>`:esc(jogo.pavilhao)}</span>`:''}</div>`}
  </div>`;
}

function jornadaHtml(j, dj){
  const dateInp = IS_ADMIN
    ? `<input type="date" value="${esc(dj.data||'')}" onchange="setData(${j},this.value)">`
    : `<span>${jornadaDateLabel(dj)}</span>`;
  const _sorted = dj.jogos.map((jg,gi)=>({jg,gi})).sort((a,b)=>{
    const da=(a.jg.data||dj.data||"")+"T"+(a.jg.hora||"00:00");
    const db=(b.jg.data||dj.data||"")+"T"+(b.jg.hora||"00:00");
    return da.localeCompare(db);
  });
  const jogosHtml = _sorted.map(({jg,gi})=>jogoHtml(j,gi,jg,dj)).join("");
  return `<div class="jornada">
    <div class="jornada-head">
      <div class="jornada-title">Jornada <span class="n">${j}</span></div>
      <div class="jornada-date" style="${IS_ADMIN?'':`display:none`}">${dateInp}</div>
    </div>
    <div class="jogos">${jogosHtml}</div>
  </div>`;
}


function computeClassif(){
  const t = {};
  Object.keys(TEAMS).forEach(id=>{
    t[id]={pts:0,j:0,v:0,e:0,d:0,gm:0,gs:0};
  });
  for(let j=1;j<=22;j++){
    const dj=DATA.jornadas[j]; if(!dj) continue;
    dj.jogos.forEach(g=>{
      if(g.golosCasa==null||g.golosFora==null) return;
      const c=t[g.casa], f=t[g.fora];
      c.j++; f.j++;
      c.gm+=g.golosCasa; c.gs+=g.golosFora;
      f.gm+=g.golosFora; f.gs+=g.golosCasa;
      if(g.golosCasa>g.golosFora){c.v++;c.pts+=3;f.d++;}
      else if(g.golosCasa<g.golosFora){f.v++;f.pts+=3;c.d++;}
      else{c.e++;f.e++;c.pts++;f.pts++;}
    });
  }
  return Object.entries(t).map(([id,s])=>({id,...s,dg:s.gm-s.gs,name:TEAMS[id].name,logo:TEAMS[id].logo,short:TEAMS[id].short,color:TEAMS[id].color})).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gm-a.gm||a.name.localeCompare(b.name));
}
function renderClassif(){
  const rows=computeClassif();
  const anyPlayed=rows.some(r=>r.j>0);
  if(!anyPlayed){ document.getElementById('classif-wrap').innerHTML=''; return; }
  let html='<div class="classif-box"><h3>Classificação</h3><table class="classif"><thead><tr><th></th><th></th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const pos=i+1;
    const logo=r.logo?`<img class="tl" src="${esc(r.logo)}" alt="" onerror="this.style.display='none'">`:`<span style="display:inline-block;width:20px;height:20px;background:${r.color};border-radius:4px;color:#fff;text-align:center;font-size:9px;line-height:20px;font-weight:700;margin-right:6px">${esc(r.short)}</span>`;
    html+=`<tr class="p${pos}"><td class="pos">${pos}</td><td class="name">${logo}${esc(r.name)}</td><td class="pts">${r.pts}</td><td>${r.j}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gm}</td><td>${r.gs}</td><td>${r.dg>0?'+':''}${r.dg}</td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('classif-wrap').innerHTML=html;
}

function render(){
  renderClassif();
  const fj = filterJ.value;
  const ft = filterT.value;
  let html = "";
  let played = 0, total = 0;
  for(let j=1; j<=22; j++){
    const dj = DATA.jornadas[j];
    if(!dj) continue;
    total += dj.jogos.length;
    played += dj.jogos.filter(x=>x.golosCasa!=null && x.golosFora!=null).length;
    if(fj && String(j) !== fj) continue;
    if(ft){
      // filtra jogos onde a equipa participa
      const jogosF = dj.jogos.filter(g => String(g.casa)===ft || String(g.fora)===ft);
      if(jogosF.length === 0) continue;
      const dj2 = Object.assign({}, dj, {jogos: jogosF});
      html += jornadaHtml(j, dj2);
    } else {
      html += jornadaHtml(j, dj);
    }
  }
  grid.innerHTML = html || `<div style="text-align:center;padding:40px;color:var(--muted)">Sem jogos que correspondam ao filtro.</div>`;
  document.getElementById("stat-played").textContent = played;
}

window.setGolo = function(j,gi,side,val){
  const v = val === "" ? null : Math.max(0, Math.min(99, parseInt(val)));
  DATA.jornadas[j].jogos[gi][side==='casa'?'golosCasa':'golosFora'] = v;
  save(); render();
};
window.setMeta = function(j,gi,key,val){
  DATA.jornadas[j].jogos[gi][key] = val;
  save();
};
window.setData = function(j,val){
  DATA.jornadas[j].data = val;
  save(); render();
};

window.exportarJSON = function(){
  try{
    const blob = new Blob([JSON.stringify(DATA,null,2)],{type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url;
    a.download = "liga-placard-2026-27-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert("Erro: "+e.message); }
};
window.importarJSON = function(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const p = JSON.parse(rd.result);
        if(!confirm("Substituir dados actuais?")) return;
        DATA = p; save(); render();
        alert("Importado.");
      }catch(e){ alert("JSON inválido: "+e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
};

  const btn = document.querySelector('button[onclick="gravarHTML()"]');
  const orig = btn.textContent;
  btn.textContent = "⏳ A preparar…"; btn.disabled = true;
  const reset = ()=>{ btn.textContent = orig; btn.disabled = false; };

    try{
      const dataStr = JSON.stringify(DATA);
      let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const escaped = dataStr.replace(/<\/script>/gi, "<\\/script>");
      html = html.replace(/const INITIAL_DATA = \{[\s\S]*?\};/, `const INITIAL_DATA = ${escaped};`);
      html = html.replace(/<body\s+class="admin"\s*>/i, "<body>");
      const blob = new Blob([html],{type:"text/html"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      btn.textContent = "✅ Descarregado";
      setTimeout(reset, 2500);
    }catch(e){ alert("Erro: "+e.message); reset(); }
  }, 50);
};

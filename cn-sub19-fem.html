<style>
  :root{--bg:#0b0f1a;--bg2:#111827;--card:#161e2e;--card2:#1f2937;--line:#2b3648;--text:#eef2f7;--muted:#93a1b1;--accent:#ec4899;--green:#10b981;--red:#ef4444}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  .hero{background:linear-gradient(135deg,#0b1220 0%,#1e293b 100%);padding:36px 28px;border-radius:16px;margin-bottom:20px;position:relative;overflow:hidden;text-align:center}
  .hero::before{content:"";position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(251,146,60,.15),transparent 70%);pointer-events:none}
  .hero .eyebrow{font-size:12px;color:#93a1b1;text-transform:uppercase;letter-spacing:2.5px;margin-bottom:10px}
  .hero h1{font-size:36px;font-weight:900;margin:0;letter-spacing:-1px;line-height:1.05}
  .hero h1 .lig{color:#fb923c}
  .hero .lede{font-size:15px;color:#cbd5e1;margin:12px auto 0;max-width:760px;line-height:1.55}
  .hero .stats{display:flex;gap:24px;margin-top:22px;flex-wrap:wrap;justify-content:center}
  .hero .stat b{display:block;font-size:26px;font-weight:800;color:#f3f4f6}
  .hero .stat span{font-size:11px;color:#93a1b1;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;display:block}

  .serie-tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--card);padding:6px;border-radius:12px;border:1px solid var(--line);position:sticky;top:0;z-index:60;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .serie-tab{flex:1;padding:12px 16px;background:transparent;border:0;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;border-radius:8px;font-family:inherit;transition:all .15s;letter-spacing:.05em}
  .serie-tab:hover{color:var(--text)}
  .serie-tab.active{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;box-shadow:0 4px 12px rgba(236,72,153,.35)}

  .toolbar{background:var(--card);padding:14px 18px;border-radius:12px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid var(--line)}
  .toolbar label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .toolbar select{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;font-family:inherit;min-width:150px}
  .btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .btn.primary{background:linear-gradient(135deg,#fb923c,#ea580c);border-color:transparent;color:#fff}
  .admin-only{display:none}
  body.admin .admin-only{display:inline-flex}
  .admin-banner{display:none;position:fixed;top:12px;right:12px;z-index:500;background:linear-gradient(135deg,#dc2626,#ea580c);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 20px rgba(220,38,38,.4)}
  body.admin .admin-banner{display:inline-flex;align-items:center;gap:6px}

  .jornada{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
  .jornada-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
  .jornada-title{font-size:20px;font-weight:800}
  .jornada-title .n{color:var(--accent)}
  .jornada-date{font-size:13px;color:var(--muted);font-weight:600}
  .jornada-date input{background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:6px;font-family:inherit;font-size:12px;margin-left:6px}
  .jogos{display:grid;gap:8px}
  .jogo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--bg2);padding:12px 16px;border-radius:10px;border:1px solid transparent}
  .team-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:4px}
.mc-inline{width:100%;font-size:11px;color:#cbd5e1;line-height:1.4}
.team-side.casa .mc-inline{text-align:right}
.team-side.fora .mc-inline{text-align:left}
  .team-side.casa{justify-content:flex-end;text-align:right}
  .team-side.fora{justify-content:flex-start}
  .team-name{font-weight:600;font-size:14px}
  .team-logo{width:40px;height:40px;object-fit:contain;background:transparent;padding:0;border-radius:6px}
  .team-badge{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex:none;letter-spacing:.05em}
  .score{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;min-width:100px;justify-content:center}
  .score input{width:44px;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 4px;border-radius:6px;font-family:inherit;font-size:20px;font-weight:800;text-align:center}
  .score input:read-only{background:transparent;border:none;pointer-events:none}
  .score .sep{color:var(--muted)}
  .score .vs{color:var(--muted);font-size:14px;font-weight:600}
  .score.played{color:var(--accent)}
  .jogo-meta{grid-column:1/4;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
  .jogo-meta input{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:11px;padding:0}
  .footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-style:italic}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

  @media (max-width:900px){
    .wrap{padding:14px}
    .hero{padding:22px 18px}
    .hero h1{font-size:26px}
    .hero .lede{font-size:13px}
    .toolbar{padding:10px;gap:8px}
    .jornada{padding:14px}
    .jornada-title{font-size:17px}
  }
  @media (max-width:640px){
    html,body{max-width:100vw;overflow-x:hidden}
    .wrap{padding:10px 12px 24px;max-width:100%}
    .hero{padding:22px 14px;border-radius:14px;margin-bottom:12px}
    .hero .eyebrow{font-size:10px;letter-spacing:1.5px}
    .hero h1{font-size:clamp(20px,6.5vw,26px)}
    .hero .lede{font-size:12.5px;margin:10px auto 0}
    .hero .stats{gap:8px;margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr)}
    .hero .stat b{font-size:clamp(16px,5vw,20px)}
    .hero .stat span{font-size:9px}
    .serie-tab{font-size:14px;padding:10px 12px}
    .toolbar{padding:8px;gap:6px}
    .toolbar select{padding:10px 8px;font-size:14px;flex:1;min-width:0}
    .jornada{padding:14px 10px;margin-bottom:12px}
    .jornada-head{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);flex-direction:column;align-items:flex-start;gap:4px}
    .jornada-title{font-size:16px}
    .jornada-date{font-size:11.5px}
    .jogos{gap:6px}
    .jogo{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:6px;padding:10px 8px;min-height:58px}
    .team-side{gap:6px;min-width:0;overflow:hidden}
    .team-name{font-size:12.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;flex:1;min-width:0}
    .team-logo,.team-badge{width:32px;height:32px;padding:0;flex:none;font-size:10.5px}
    .score{font-size:16px;min-width:72px;width:72px;gap:4px;padding:0}
    .score input{width:28px;height:34px;font-size:16px;padding:0}
    .score .sep{font-size:14px}
    .score .vs{font-size:11px}
    .jogo-meta{grid-column:1/4;font-size:10.5px;gap:8px;padding-top:6px;margin-top:4px;justify-content:center;flex-wrap:wrap}
  }
.hero-logo-wrap{text-align:center;margin-bottom:14px}.hero-logo{max-height:200px;width:auto;max-width:90%;height:auto;border-radius:8px}@media (max-width:640px){.hero-logo{max-height:150px}}

.team-logo[src*="20503_"]{filter:invert(1) brightness(2) contrast(1) grayscale(1)}.team-logo[src*="10510_"]{filter:invert(1) hue-rotate(180deg)}.score input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.score input[type="number"]::-webkit-outer-spin-button,.score input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score .v{font-size:1.4em;font-weight:700;min-width:24px;text-align:center;display:inline-block;padding:2px 6px;line-height:1;color:#fff}
.marcadores-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:0;font-size:11px;color:#cbd5e1;margin-top:6px;padding:8px;background:rgba(255,255,255,.02);border-radius:6px;align-items:start}
.marcadores-wrap .mc{white-space:normal;line-height:1.5}
.marcadores-wrap .mc.casa{padding-left:20%;padding-right:10px;text-align:right}
.marcadores-wrap .mc.fora{padding-right:20%;padding-left:10px;text-align:left}
@media (max-width:768px){.marcadores-wrap{padding:6px 4px;gap:4px;font-size:10.5px}.marcadores-wrap .mc.casa{padding-left:2%;padding-right:4px}.marcadores-wrap .mc.fora{padding-right:2%;padding-left:4px}}
.marcadores-wrap .mc.sep{color:#6b7280;font-size:12px;align-self:center}
.marcadores-wrap .mc b{color:#f3f4f6;font-weight:500}

<script>
(function(){
  const CURRENT = "1787905819";
  const KEY = "app_ver";
  async function check(){
    try{
      const r = await fetch("./version.txt?_="+Date.now(),{cache:"no-store"});
      const remote = (await r.text()).trim();
      const local = localStorage.getItem(KEY);
      if(local && remote !== local){ localStorage.setItem(KEY,remote); location.reload(); return; }
      if(!local) localStorage.setItem(KEY,remote);
    }catch(e){}
  }
  check();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
})();
</script>

function load(){

    try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  }
  return JSON.parse(JSON.stringify(INITIAL_DATA));
}
function save(){
  if(IS_ADMIN){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){} }
}

const grid = document.getElementById("grid");
const filterJ = document.getElementById("filter-jornada");
const filterT = document.getElementById("filter-team");

function populateFilters(){
  const s = DATA.series[SERIE];
  filterJ.innerHTML = '<option value="">Todas as jornadas</option>';
  Object.keys(s.jornadas).sort((a,b)=>+a-+b).forEach(j=>{
    const o = document.createElement("option"); o.value=j; o.textContent="Jornada "+j;
    filterJ.appendChild(o);
  });
  const teamIds = new Set();
  Object.values(s.jornadas).forEach(dj=>dj.jogos.forEach(g=>{teamIds.add(g.casa); teamIds.add(g.fora);}));
  filterT.innerHTML = '<option value="">Todas as equipas</option>';
  [...teamIds].sort((a,b)=>TEAMS[a].name.localeCompare(TEAMS[b].name)).forEach(id=>{
    const o = document.createElement("option"); o.value=id; o.textContent=TEAMS[id].name;
    filterT.appendChild(o);
  });

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}
function jornadaDateLabel(dj){
  return fmtDate(dj.data) || "";
}
function teamLogo(t){
  if(t.logo) return `<img class="team-logo" src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<div class=&quot;team-badge&quot; style=&quot;background:${t.color}&quot;>${esc(t.short)}</div>'">`;
  return `<div class="team-badge" style="background:${t.color}">${esc(t.short)}</div>`;
}
function jogoHtml(j, gi, jogo, dj){
  const casa = TEAMS[jogo.casa]; const fora = TEAMS[jogo.fora];
  const played = jogo.golosCasa != null && jogo.golosFora != null;
  const gc = jogo.golosCasa === null ? "" : jogo.golosCasa;
  const gf = jogo.golosFora === null ? "" : jogo.golosFora;
  const ro = IS_ADMIN ? "" : "readonly";
  return `<div class="jogo">
    <div class="team-side casa">
      <span class="team-name">${esc(casa.name)}</span>
      ${teamLogo(casa)}
      ${jogo.marcadoresCasa ? `<div class="mc-inline">${esc(jogo.marcadoresCasa)}</div>` : ''}
    </div>
    <div class="score ${played?'played':''}">
      <input type="number" min="0" max="99" value="${gc}" ${ro} onchange="setGolo(${j},${gi},'casa',this.value)" style="border-color:${casa.color}">
      <span class="sep">${played?'–':'vs'}</span>
      <input type="number" min="0" max="99" value="${gf}" ${ro} onchange="setGolo(${j},${gi},'fora',this.value)" style="border-color:${fora.color}">
    </div>
    <div class="team-side fora">
      ${teamLogo(fora)}
      <span class="team-name">${esc(fora.name)}</span>
      ${jogo.marcadoresFora ? `<div class="mc-inline">${esc(jogo.marcadoresFora)}</div>` : ''}
    </div>
    ${IS_ADMIN ? `<div class="jogo-meta">
      <span>🕐 <input type="time" value="${esc(jogo.hora||'')}" onchange="setMeta(${j},${gi},'hora',this.value)" style="width:80px"></span>
      <span>📍 <input type="text" value="${esc(jogo.pavilhao||'')}" placeholder="Pavilhão" onchange="setMeta(${j},${gi},'pavilhao',this.value)" style="flex:1;min-width:120px"></span>
    </div>` : `<div class="jogo-meta"><span>📅 ${fmtDateShort(jogo.data||dj.data)}</span>${jogo.hora?`<span>🕐 ${esc(jogo.hora)}</span>`:''}${jogo.pavilhao?`<span>📍 ${esc(jogo.pavilhao)}</span>`:''}</div>`
  </div>`;
}
function jornadaHtml(j, dj){
  const dateInp = IS_ADMIN
    ? `<input type="date" value="${esc(dj.data||'')}" onchange="setData(${j},this.value)">`
    : `<span>${jornadaDateLabel(dj)}</span>`;
  return `<div class="jornada">
    <div class="jornada-head">
      <div class="jornada-title">Jornada <span class="n">${j}</span></div>
      <div class="jornada-date" style="${IS_ADMIN?'':`display:none`}">${dateInp}</div>
    </div>
    <div class="jogos">${dj.jogos.map((jg,gi)=>jogoHtml(j,gi,jg,dj)).join("")}</div>
  </div>`;
}
function render(){
  const s = DATA.series[SERIE];
  const fj = filterJ.value, ft = filterT.value;
  let html="", played=0, total=0;
  const jorNums = Object.keys(s.jornadas).map(x=>+x).sort((a,b)=>a-b);
  for(const j of jorNums){
    const dj = s.jornadas[j]; if(!dj) continue;
    total += dj.jogos.length;
    played += dj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length;
    if(fj && String(j)!==fj) continue;
    if(ft){
      const jogosF = dj.jogos.filter(g=>String(g.casa)===ft||String(g.fora)===ft);
      if(jogosF.length===0) continue;
      html += jornadaHtml(j, {...dj, jogos:jogosF});
    } else html += jornadaHtml(j, dj);
  }
  grid.innerHTML = html || `<div style="text-align:center;padding:40px;color:var(--muted)">Sem jogos que correspondam ao filtro.</div>`;
  // Total played across BOTH series
  let allPlayed = 0;
  Object.values(DATA.series).forEach(ss => Object.values(ss.jornadas).forEach(jj => allPlayed += jj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length));
  document.getElementById("stat-played").textContent = allPlayed;
}

      const escaped = dataStr.replace(/<\/script>/gi, "<\\/script>");

<script>
(function(){
  const CURRENT = "1787853443";
  const KEY = "app_ver";
  async function check(){
    try{
      const r = await fetch("./version.txt?_="+Date.now(),{cache:"no-store"});
      const remote = (await r.text()).trim();
      const local = localStorage.getItem(KEY);
      if(local && remote !== local){ localStorage.setItem(KEY,remote); location.reload(); return; }
      if(!local) localStorage.setItem(KEY,remote);
    }catch(e){}
  }
  check();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
})();
</script>

const STORAGE_KEY = "cn-iii-div-masc-2026-27-v1";
const IS_ADMIN = new URLSearchParams(location.search).has("admin");
if(IS_ADMIN) document.body.classList.add("admin");

function load(){
  if(IS_ADMIN){
    try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  }
  return JSON.parse(JSON.stringify(INITIAL_DATA));
}
function save(){
  if(IS_ADMIN){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){} }
}
let DATA = load();
let SERIE = "A";

const grid = document.getElementById("grid");
const filterJ = document.getElementById("filter-jornada");
const filterT = document.getElementById("filter-team");

function populateFilters(){
  const s = DATA.series[SERIE];
  filterJ.innerHTML = '<option value="">Todas as jornadas</option>';
  Object.keys(s.jornadas).sort((a,b)=>+a-+b).forEach(j=>{
    const o = document.createElement("option"); o.value=j; o.textContent="Jornada "+j;
    filterJ.appendChild(o);
  });
  const teamIds = new Set();
  Object.values(s.jornadas).forEach(dj=>dj.jogos.forEach(g=>{teamIds.add(g.casa); teamIds.add(g.fora);}));
  filterT.innerHTML = '<option value="">Todas as equipas</option>';
  [...teamIds].sort((a,b)=>TEAMS[a].name.localeCompare(TEAMS[b].name)).forEach(id=>{
    const o = document.createElement("option"); o.value=id; o.textContent=TEAMS[id].name;
    filterT.appendChild(o);
  });
}

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const dias = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const meses = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}
function jornadaDateLabel(dj){
  return fmtDate(dj.data) || "";
}
function teamLogo(t){
  if(t.logo) return `<img class="team-logo" src="${esc(t.logo)}" alt="" onerror="this.outerHTML='<div class=&quot;team-badge&quot; style=&quot;background:${t.color}&quot;>${esc(t.short)}</div>'">`;
  return `<div class="team-badge" style="background:${t.color}">${esc(t.short)}</div>`;
}
function jogoHtml(j, gi, jogo, dj){
  const casa = TEAMS[jogo.casa]; const fora = TEAMS[jogo.fora];
  const played = jogo.golosCasa != null && jogo.golosFora != null;
  const gc = jogo.golosCasa === null ? "" : jogo.golosCasa;
  const gf = jogo.golosFora === null ? "" : jogo.golosFora;
  const ro = IS_ADMIN ? "" : "readonly";
  return `<div class="jogo">
    <div class="team-side casa">
      <span class="team-name">${esc(casa.name)}</span>
      ${teamLogo(casa)}
      ${jogo.marcadoresCasa ? `<div class="mc-inline">${esc(jogo.marcadoresCasa)}</div>` : ''}
    </div>
    <div class="score ${played?'played':''}">
      <input type="number" min="0" max="99" value="${gc}" ${ro} onchange="setGolo(${j},${gi},'casa',this.value)" style="border-color:${casa.color}">
      <span class="sep">${played?'–':'vs'}</span>
      <input type="number" min="0" max="99" value="${gf}" ${ro} onchange="setGolo(${j},${gi},'fora',this.value)" style="border-color:${fora.color}">
    </div>
    <div class="team-side fora">
      ${teamLogo(fora)}
      <span class="team-name">${esc(fora.name)}</span>
      ${jogo.marcadoresFora ? `<div class="mc-inline">${esc(jogo.marcadoresFora)}</div>` : ''}
    </div>
    ${IS_ADMIN ? `<div class="jogo-meta">
      <span>🕐 <input type="time" value="${esc(jogo.hora||'')}" onchange="setMeta(${j},${gi},'hora',this.value)" style="width:80px"></span>
      <span>📍 <input type="text" value="${esc(jogo.pavilhao||'')}" placeholder="Pavilhão" onchange="setMeta(${j},${gi},'pavilhao',this.value)" style="flex:1;min-width:120px"></span>
    </div>` : `<div class="jogo-meta"><span>📅 ${fmtDateShort(jogo.data||dj.data)}</span>${jogo.hora?`<span>🕐 ${esc(jogo.hora)}</span>`:''}${jogo.pavilhao?`<span>📍 ${esc(jogo.pavilhao)}</span>`:''}</div>`}
  </div>`;
}
function jornadaHtml(j, dj){
  const dateInp = IS_ADMIN
    ? `<input type="date" value="${esc(dj.data||'')}" onchange="setData(${j},this.value)">`
    : `<span>${jornadaDateLabel(dj)}</span>`;
  return `<div class="jornada">
    <div class="jornada-head">
      <div class="jornada-title">Jornada <span class="n">${j}</span></div>
      <div class="jornada-date" style="${IS_ADMIN?'':`display:none`}">${dateInp}</div>
    </div>
    <div class="jogos">${dj.jogos.map((jg,gi)=>jogoHtml(j,gi,jg,dj)).join("")}</div>
  </div>`;
}
function render(){
  const s = DATA.series[SERIE];
  const fj = filterJ.value, ft = filterT.value;
  let html="", played=0, total=0;
  const jorNums = Object.keys(s.jornadas).map(x=>+x).sort((a,b)=>a-b);
  for(const j of jorNums){
    const dj = s.jornadas[j]; if(!dj) continue;
    total += dj.jogos.length;
    played += dj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length;
    if(fj && String(j)!==fj) continue;
    if(ft){
      const jogosF = dj.jogos.filter(g=>String(g.casa)===ft||String(g.fora)===ft);
      if(jogosF.length===0) continue;
      html += jornadaHtml(j, {...dj, jogos:jogosF});
    } else html += jornadaHtml(j, dj);
  }
  grid.innerHTML = (filterJ.value===''&&filterT.value===''?renderStandingsHtml(SERIE):'') + (html || `<div style="text-align:center;padding:40px;color:var(--muted)">Sem jogos que correspondam ao filtro.</div>`);
  // Total played across BOTH series
  let allPlayed = 0;
  Object.values(DATA.series).forEach(ss => Object.values(ss.jornadas).forEach(jj => allPlayed += jj.jogos.filter(x=>x.golosCasa!=null&&x.golosFora!=null).length));
  document.getElementById("stat-played").textContent = allPlayed;
}

function calcStandings(serieKey){
  const sData=DATA.series[serieKey];
  const table={};
  for(const jObj of Object.values(sData.jornadas)){
    for(const g of jObj.jogos){
      const c=String(g.casa),fo=String(g.fora);
      if(!table[c]) table[c]={p:0,v:0,e:0,d:0,gf:0,gc:0,pts:0};
      if(!table[fo]) table[fo]={p:0,v:0,e:0,d:0,gf:0,gc:0,pts:0};
      if(g.golosCasa==null||g.golosFora==null) continue;
      const gc=+g.golosCasa,ga=+g.golosFora;
      table[c].p++;table[fo].p++;
      table[c].gf+=gc;table[c].gc+=ga;
      table[fo].gf+=ga;table[fo].gc+=gc;
      if(gc>ga){table[c].v++;table[c].pts+=3;table[fo].d++;}
      else if(gc<ga){table[fo].v++;table[fo].pts+=3;table[c].d++;}
      else{table[c].e++;table[c].pts++;table[fo].e++;table[fo].pts++;}
    }
  }
  const rows=Object.entries(table).map(([id,st])=>({
    id,name:(TEAMS[id]&&TEAMS[id].name)||id,...st,dg:st.gf-st.gc
  })).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.name.localeCompare(b.name));
  return rows.map((r,i)=>({pos:i+1,...r}));
}
function renderStandingsHtml(serieKey){
  const rows=calcStandings(serieKey);
  if(!rows.length) return '';
  const n=rows.length;
  let html='<div class="classif-box"><h3>📊 Classificação</h3><table class="classif"><thead><tr><th></th><th style="text-align:left">Equipa</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GM</th><th>GS</th><th>DG</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const cls='p'+r.pos+(i===n-1?' bottom':'');
    html+=`<tr class="${cls}"><td class="pos">${r.pos}</td><td class="name">${r.name}</td><td class="pts">${r.pts}</td><td>${r.p}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.dg>0?'+':r.dg===0?'':'-'}${Math.abs(r.dg)}</td></tr>`;
  });
  html+='</tbody></table></div>';
  return html;
}

window.importarJSON = function(){

  inp.onchange = ()=>{
    const f = inp.files&&inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{ const p = JSON.parse(rd.result); if(!confirm("Substituir dados actuais?")) return; DATA=p; save(); render(); alert("Importado."); }catch(e){ alert("JSON inválido: "+e.message); }
    };
    rd.readAsText(f);
  }; inp.click();
};
